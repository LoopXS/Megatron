# Help Menus

cmda: "✘ Kullanılabilir komutlar"
help_admintools: "-\n\n• `.promote <reply to user/userid/username>`\n• `.demote`\n    yükselt/yetkisini düşür  kullanıcı içinde  sohbet.\n\n• `.ban <reply to user/userid/username> <reason>`\n• `.unban`\n    yasakla/yasağı kaldır  kullanıcı -den  sohbet.\n\n• `.kick <reply to user/userid/username> <reason>`\n    at  kullanıcı -den  sohbet.\n\n• `.pin <reply to message>`\n    sabitle  mesaj içinde  sohbet\n• `.tpin <time> <temp pin message>`\n• `.unpin (all) <reply to message>`\n    sabitlemeyi kaldır  mesajlar içinde  sohbet.\n\n• `.pinned`\n   Al pinned mesaj içinde  mevcut sohbet.\n• `.listpinned`\n   Al tümü pinned mesajlar içinde mevcut sohbet\n\n• `.autodelete <24h/7d/1m/off>`\n   etkinleştir Auto Sil mesajlar içinde sohbet.\n\n• `.purge <reply to message>`\n    Purge tümü mesajlar -den  replied mesaj.\n\n• `.purgeme <reply to message>`\n    Purge yalnızca sizin mesajlar -den  replied mesaj.\n\n• `.purgeall`\n    Sil tümü msgs -içinde replied kullanıcı.\n\n• `.mypurge`\n    Sil tümü sizin msgs .\n"
help_afk: " -\n\n• `{i}afk <optional reason>`\n    AFK means away -den keyboard,\n    After bu  activated, eğer birisi tags veya mesajlar siz, he/she would al bir automated yanıt -den  bot.\n\n    (Note : Ayarla bir medya dosya içinde afk mesajlar by replying -e herhangi bir medya ile `{i}afk <reason>`).\n\n"
help_antiflood: " -\n\n• `{i}setflood <integer>`\n    Ayarla flood limit içinde bir sohbet.\n\n• `{i}remflood`\n    Kaldır flood limit -den bir sohbet.\n\n• `{i}getflood`\n    Al flood limit -içinde bir sohbet.\n"
help_asstcmd: " -\n\n•`{i}addcmd <new cmd> <reply>`\n   It will ayarla yeni cmd süreyle sizin assistant bot ile o yanıt mesaj.\n\n•`{i}remcmd <cmd name>`\n   It will kaldır sizin cmd.\n\n•`{i}listcmd`\n   ile Al listele -içinde tümü sizin özel cmd.\n"
help_audiotools: "✘ Kullanılabilir komutlar - \n`.makevoice <reply to audio>`\n   creates bir ses not -den ses.\n\n`.atrim <from time> - <to time>`\n   trim ses as başına verilen zaman.\n   zaman must be içinde saniye. `.atrim 50-70`\n\n`.extractaudio <reply to media>`\n   ile extract  ses -den it.\n\n"
help_autoban: "\n\n• `{i}autokick <on/off>`\n    üzerinde - ile etkinleştir.\n    off - ile devre dışı bırak.\n    Automatically at yeni katıldı kullanıcılar -den  grup.\n"
help_beautify: " -\n\n• `{i}carbon <text/reply to msg/reply to document>`\n    Carbonise  metin ile varsayılan ayarlar.\n\n• `{i}rcarbon <text/reply to msg/reply to document>`\n    Carbonise  metin, ile rastgele bg colours.\n\n• `{i}ccarbon <color ><text/reply to msg/reply to document>`\n    Carbonise  metin, ile özel bg colours.\n\n• `{i}rayso <opt-theme> <text>/<reply to message>`\n  `{i}rayso list` - `Get list of themes.`\n"
help_blacklist: " -\n\n• `{i}blacklist <word/all words with a space>`\n    blacklist  choosen kelime içinde o sohbet.\n\n• `{i}remblacklist <word>`\n    Kaldır  kelime -den blacklist..\n\n• `{i}listblacklist`\n    listele tümü blacklisted kelimeler.\n\n  'eğer bir person uses blacklist Word his/her msg will be deleted'\n  've u Must be yönetici içinde o sohbet'\n"
help_bot: "\n\n• `{i}alive` | `{i}alive inline`\n    Check eğer sizin bot  çalışıyor.\n\n• `{i}ping`\n    Check bot response zaman.\n\n• `{i}update`\n    See changelogs eğer herhangi bir güncelle  mevcut.\n\n• `{i}cmds`\n    görüntüle tümü eklenti names.\n\n• `{i}restart`\n    ile yeniden başlat sizin bot.\n\n• `{i}logs (sys)`\n    Al  full terminal logs.\n• `{i}logs carbon`\n    Al  carbonized sys logs.\n• `{i}logs heroku`\n   Al  en son 100 lines -içinde heroku logs.\n\n• `{i}shutdown`\n    Turn off sizin bot.\n"
help_broadcast: "\n\n• `{i}addch <id/reply to list/none>`\n    ekle sohbet -e veritabanı. Adds mevcut sohbet eğer yok kimlik belirtilen.\n\n• `{i}remch <all/id/none>`\n    Removes  belirtilen sohbet (mevcut sohbet eğer none belirtilen), veya tümü chats.\n\n• `{i}broadcast <reply to msg>`\n    Gönder  replied mesaj -e tümü chats içinde veritabanı.\n\n• `{i}forward <reply to msg>`\n     ilet  mesaj -e tümü chats içinde veritabanı.\n\n• `{i}listchannels`\n    ile al listele -içinde tümü eklendi chats.\n"
help_button: " -\n\n• `{i}button <text with button format`\n   oluştur düğme u -ebilir yanıt -e pic also\n\nFormat:- `{i}button Hey There! @DarkPentesterBot 😎.\n[DarkPentesterBot | t.me/DarkPentesterBot][Support | t.me/DarkPentesterBot | same]\n[DarkPentesterBot | t.me/DarkPentesterBot]`\n"
help_calculator: " -\n\n•`{i}calc` - Inline Calculator\n\n"
help_channelhacks: "\n\n🔹 `{i}shift <from channel> | <to channel>`\n     bu will transfer tümü eski post -den kanal bir -e kanal B.\n      (u -ebilir kullan kullanıcı adı veya kimlik -içinde kanal too)\n      örnek : `{i}shift @abc | @xyz`\n      [not - bu (' | ') sign  nessesary]\n\n🔹 için auto-gönderme/iletme tümü yeni mesaj -den herhangi bir kaynak kanal -e herhangi bir hedef kanal.\n\n   `{i}asource <channel username or id>`\n      bu ekle kaynak kanal -e veritabanı\n   `{i}dsource <channel username or id>`\n      bu kaldır kaynak kanallar -den veritabanı\n   `{i}listsource <channel username or id>`\n      göster listele -içinde kaynak kanallar\n\n\n   `{i}adest <channel username or id>`\n      bu ekle Ur kanallar -e veritabanı\n   `{i}ddest <channel username or id>`\n      bu Kaldır Ur kanallar -den veritabanı\n   `{i}listdest <channel username or id>`\n      göster Liste -içinde Ur kanallar\n\n   'siz -ebilir ayarla many kanallar içinde veritabanı'\n   'için activating auto-post kullan `{i}setdb AUTOPOST True` '\n"
help_chatbot: " -\n\n• `{i}addai <reply to user/give username/userid>`\n   ekle bir AI ChatBot -e yanıt -e o kullanıcı.\n\n• `{i}remai <reply to user/give username/userid>`\n   Kaldır  AI ChatBot.\n\n• `{i}repai <reply to user/give a message>`\n   Yanıt ver -e  kullanıcı ile bir mesaj by bir AI.\n\n• `{i}listai`\n   Liste  şu anda AI eklendi kullanıcılar.\n"
help_chats: " -\n\n• `{i}delchat <optional- username/id>`\n    Sil  grup bu cmd  kullanılan içinde.\n\n• `{i}getlink`\n• `{i}getlink r` - `create link with admin approval`\n• `{i}getlink r title_here` - `admin approval with link title`\n• `{i}getlink 10` - `usage limit in new link`\n    Al bağlantı -içinde grup bu cmd  kullanılan içinde.\n\n• `{i}create (g|b|c) <group_name> ; <optional-username>`\n    oluştur grup woth bir specific ad.\n    g - megagroup/supergroup\n    b - small grup\n    c - kanal\n\n• `{i}setgpic <reply to Photo><chat username>`\n    Ayarla profil fotoğraf -içinde grup.\n\n• `{i}delgpic <chat username -optional>`\n    Sil profil fotoğraf -içinde grup.\n\n• `{i}unbanall`\n    yasağı kaldır tümü üyeler -içinde bir grup.\n\n• `{i}rmusers`\n    Kaldır kullanıcılar specifically.\n"
help_cleanaction: " -\n\n•`{i}addclean`\n    temizle tümü Upcoming işlem msg içinde eklendi sohbet gibi birisi katıldı/ayrıldı/sabitle etc.\n\n•`{i}remclean`\n    Kaldır sohbet -den veritabanı.\n\n•`{i}listclean`\n   ile al listele -içinde tümü chats burada its activated.\n\n"
help_converter: " -\n\n• `{i}convert <gif/img/sticker/webm>`\n    Yanıt ver -e medya -e dönüştür it into gif / görsel / webm / normal çıkartma.\n\n• `{i}doc <filename.ext>`\n    Yanıt ver -e bir metin msg -e kaydet it içinde bir dosya.\n\n• `{i}open`\n    Yanıt ver -e bir dosya -e reveal it's metin.\n\n• `{i}rename <file name with extension>`\n    yeniden adlandır  dosya\n\n• `{i}thumbnail <reply to image/thumbnail file>`\n    Yükle Sizin dosya ile sizin özel küçük resim.\n"
help_core: " -\n\n• `{i}install <reply to plugin>`\n    ile kur  eklenti,\n  `{i}install f`\n    ile force kur.\n\n• `{i}uninstall <plugin name>`\n    ile kaldır ve kaldır  eklenti.\n\n• `{i}load <plugin name>`\n    ile yükle kaldırıldı unofficial eklenti.\n\n• `{i}unload <plugin name>`\n    ile kaldır unofficial eklenti.\n\n• `{i}help <plugin name>`\n    Shows siz bir yardım menu (gibi bu) süreyle every eklenti.\n\n• `{i}getaddons <raw link to code>`\n    yükle Eklentiler -den  verilen raw bağlantı.\n"
help_database: " -\n\n• **veritabanı komutlar, do not kullan eğer siz don't know what it .**\n\n• `{i}setdb key | value`\n    Ayarla değer içinde veritabanı.\n    e.g :\n    `{i}setdb hi there`\n    `{i}setdb hi there | heartless here`\n    `{i}setdb --extend variable value` veya `{i}setdb -e variable value` -e ekle  değer -e  exiting values içinde db.\n\n• `{i}deldb key`\n    Sil anahtar -den DB.\n\n• `{i}rendb old keyname | new keyname`\n    güncelle anahtar ad\n"
help_devtools: " -\n\n• `{i}bash <cmds>`\n• `{i}bash -c <cmds>` Carbon görsel as komut output.\n    Run linux komutlar üzerinde telegram.\n\n• `{i}eval <code>`\n    Evaluate python komutlar üzerinde telegram.\n    Shortcuts:\n        client = bot = event.client\n        e = event\n        p = print\n        yanıt = await event.al_yanıt_mesaj()\n        sohbet = event.sohbet_kimlik\n\n• `{i}cpp <code>`\n    Run c++ code -den Telegram.\n\n• `{i}sysinfo`\n    Shows System bilgi.\n"
help_downloadupload: " -\n\n• `{i}ul <path/to/file>`\n    Yükle dosyalar üzerinde telegram.\n    kullan following arguments before veya after filename as başına requirement:\n      `--stream` -e yükleme as stream.\n      `--delete` -e sil dosya after yükleniyor.\n      `--no-thumb` -e yükleme olmadan küçük resim.\n\n• `{i}dl <filename(optional)>`\n    Yanıt ver -e dosya -e indirme.\n\n• `{i}download <DDL> (| filename)`\n    İndir kullanarak DDL. Will autogenerate filename eğer not verilen.\n"
help_echo: "\n\n•`{i}addecho <reply to anyone>`\n   Başlat Auto Echo mesaj -içinde Replied kullanıcı.\n\n•`{i}remecho <reply to anyone>`\n   Turn It off\n\n•`{i}listecho <reply to anyone>`\n   ile Al listele.\n"
help_extra: " -\n\n• `{i}del <reply to message>`\n    Sil  replied mesaj.\n\n• `{i}edit <new message>`\n    Edit sizin last mesaj veya replied msg.\n\n• `{i}copy <reply to message>`\n    kopyala replied mesaj / medya.\n\n• `{i}reply`\n    Yanıt ver  last sent msg -e replied kullanıcı.\n"
help_fakeaction: " -\n\n<b>Fake Actions</b>\n\n• `{i}ftyping [time]`\n• `{i}faudio [time]`\n• `{i}fvideo [time]`\n• `{i}fgame [time]`\n• `{i}fsticker [time]`\n• `{i}flocation [time]`\n• `{i}fcontact [time]`\n• `{i}fround [time]`\n• `{i}fphoto [time]`\n• `{i}fdocument [time]`\n    `Show the selected Telegram action for the specified duration.`\n\n<b>süre</b>\n    `<number>` = saniye\n    `<number>s` = saniye\n    `<number>m` = dakika\n    `<number>h` = saat\n    `<number>d` = gün\n\n    `Examples:`\n    `{i}ftyping 10`\n    `{i}ftyping 30s`\n    `{i}ftyping 5m`\n    `{i}ftyping 2h`\n    `{i}ftyping 1d`\n\n<b>Target</b>\n    `Actions can be sent to the current chat or a specific user/chat.`\n\n    `{i}ftyping @username 10`\n    `{i}ftyping 123456789 10`\n    `{i}ftyping 10 @username`\n    `{i}ftyping 10 123456789`\n\n    `Username and numeric Telegram ID are supported.`\n\n<b>varsayılan süre</b>\n    `{i}ftyping`\n    `If no duration is specified, the default duration is used.`\n\n<b>Durdur Normal Action</b>\n    `{i}ftyping off`\n    `{i}ftyping off @username`\n    `{i}ftyping off 123456789`\n    `Use off to stop an active fake action.`\n\n<b>tümü Mode</b>\n    `{i}all ftyping 10`\n    `Run Fake Typing automatically whenever a new incoming message is received.`\n\n    `{i}all ftyping 10h`\n    `Keep the fake action active for 10 hours whenever a new message triggers it.`\n\n    `{i}all ftyping @username 10`\n    `{i}all ftyping 10 @username`\n    `Only messages from the specified user trigger the action.`\n\n    `{i}all ftyping 123456789 10`\n    `A numeric user ID can also be used as the trigger target.`\n\n<b>Durdur tümü Mode</b>\n    `{i}all ftyping off`\n    `{i}all faudio off`\n    `{i}all fvideo off`\n    `The same format works with every Fake Action.`\n\n<b>FSeen</b>\n    `{i}fseen`\n    `In a private chat, automatically mark new messages from that user as read.`\n\n    `{i}fseen @username`\n    `{i}fseen 123456789`\n    `Monitor a specific user by username or numeric ID.`\n\n    `In groups, reply to the user's message and use {i}fseen.`\n\n<b>FSeen tümü Mode</b>\n    `{i}all fseen`\n    `{i}all fseen @username`\n    `{i}all fseen 123456789`\n    `Automatically mark new messages from the selected user as read.`\n\n    `ALL mode only reacts to messages received after activation.`\n\n<b>Durdur FSeen</b>\n    `{i}fseen off`\n    `{i}fseen off @username`\n    `{i}fseen off 123456789`\n    `Stops automatic read acknowledgement for the selected user.`\n\n<b>Durdur FSeen tümü Mode</b>\n    `{i}all fseen off`\n    `{i}all fseen off @username`\n    `{i}all fseen off 123456789`\n    `Stops the selected FSeen ALL watcher.`\n\n<b>Notes</b>\n    `• ALL mode applies only to messages received after activation.`\n    `• A new message in the same chat replaces the previous fake-action task.`\n    `• Fake Telegram actions are chat-wide and cannot be displayed to only one member of a group.`\n    `• FSeen uses Telegram's read acknowledgement system.`\n    `• Numeric IDs may require the account to have previously encountered or have access to the target entity.`\n    `• Each Fake Action can have its own independent ALL mode.`\n"
help_fedutils: " -\n\n• `{i}superfban <reply to user/userid/username>`\n    FBan  person across tümü feds içinde which siz  yönetici.\n\n• `{i}superunfban <reply to user/userid/username>`\n    Un-FBan  person across tümü feds içinde which siz  yönetici.\n\nSpecify FBan grup ve Feds -e exclude içinde  assistant.\n\n• `{i}fstat <username/id/reply to user>`\n    Collect fed stat -içinde  person içinde Rose.\n\n• `{i}fedinfo <(fedid)>`\n    Collect federation bilgi -içinde  verilen fed kimlik, veya -içinde  fed siz own, -den Rose.\n"
help_fileshare: " -\n\n• `{i}fs <query>`\n    `Search your saved/shared files by name.`\n\n• `{i}fileshare <query>`\n    `Same as fs. Search and share files inline.`\n\n• `{i}fs`\n    `Open the Fileshare inline interface and browse your available files.`\n\n**Inline Mode:**\n    `All Fileshare operations are designed to work inline.`\n\n    `Type the command followed by your query and choose a result from the inline list.`\n\n    `Example:`\n    `{i}fs song`\n    `{i}fs movie`\n    `{i}fs document`\n\n**Ara:**\n    `{i}fs <name>`\n    `Search files by their filename or stored title.`\n\n    `{i}fs pdf`\n    `{i}fs photo`\n    `{i}fs myfile`\n\n    `The search is case-insensitive and supports partial names.`\n\n**dosya Types:**\n    `Files can be searched and displayed according to their media type.`\n\n    `Supported categories may include:`\n    `Documents, Photos, Videos, Audio, Voice, Archives and other files.`\n\n**Pagination:**\n    `If more files are available than can be displayed at once, use the navigation buttons in the inline interface to load the next or previous page.`\n\n    `Pagination prevents large file collections from slowing down the inline search.`\n\n<**dosya bilgi:**\n    `Each result can display useful information about the file, including:`\n    `Filename, file type, size, duration when available, and other available metadata.`\n\n**Sharing:**\n    `Select any file from the inline results to send/share it in the current chat.`\n\n    `Files are shared using Telegram's stored media whenever possible, avoiding unnecessary re-uploads.`\n\n**Inline Ara örnekler:**\n    `{i}fs linux`\n    `{i}fs tutorial`\n    `{i}fs mp3`\n    `{i}fs .zip`\n    `{i}fs 1080p`\n\n**Exact Ara:**\n    `Use the complete filename when you want to find a specific file.`\n\n    `{i}fs Ubuntu 24.04.iso`\n    `{i}fs My Document.pdf`\n\n**Partial Ara:**\n    `You can also provide only a part of the filename.`\n\n    `{i}fs Ubuntu`\n    `{i}fs Document`\n    `{i}fs tutorial`\n\n**Media Filtering:**\n    `Use a media type or extension as part of the search query to narrow the results.`\n\n    `{i}fs mp4`\n    `{i}fs mp3`\n    `{i}fs pdf`\n    `{i}fs zip`\n    `{i}fs jpg`\n\n**dosya Management:**\n    `Files stored by Fileshare can be managed without manually searching through Telegram messages.`\n\n    `The inline interface provides the available management actions for supported files.`\n\n**Sil:**\n    `Use the delete option available in the file's inline controls to remove a stored file when supported.`\n\n    `Deletion requires confirmation to prevent accidental removal.`\n\n**Cleanup:**\n    `The cleanup option can be used to remove obsolete or unwanted stored entries when supported by the plugin.`\n\n    `Use cleanup carefully because removed entries may no longer appear in Fileshare search results.`\n\n**dosya ayrıntılar:**\n    `Open the details option from an inline result to inspect the stored information before sharing or managing the file.`\n\n**Quick Usage:**\n    `1. Open any Telegram chat.`\n    `2. Start the Fileshare inline command.`\n    `3. Enter the filename or part of the filename.`\n    `4. Select the desired file from the results.`\n    `5. Telegram sends the selected file to the current chat.`\n\n**Performance:**\n    `Fileshare uses indexed/searchable stored information so large collections can be searched without loading every file into memory for every request.`\n\n    `Pagination and controlled result limits are used to keep inline responses fast.`\n\n**Notes:**\n    `Search results depend on the files available to Fileshare and the metadata stored for each file.`\n    `A file that has been deleted from the underlying Telegram storage may no longer be shareable.`\n    `Very large files may be subject to Telegram's own file and account limitations.`\n    `Inline results are generated dynamically and may be cached according to the plugin configuration.`\n    `If a result becomes invalid, refresh the inline search and try again.`\n"
help_filter: " -\n\n• `{i}addfilter <word><reply to a message>`\n    ekle  kullanılan kelime as filtre relating -e replied mesaj.\n\n• `{i}remfilter <word>`\n    Kaldır  filtered kullanıcı..\n\n• `{i}listfilter`\n    listele tümü filtreler.\n"
help_fontgen: "\n• `{i}font <font name> : <text>`\n    oluştur farklı yazı tipleri süreyle  metin.\n\n• `{i}font`\n    ile al listele -içinde yazı tipleri\n"
help_giftools: "\n\n•`{i}invertgif`\n  Make Gif Inverted(negative).\n\n•`{i}bwgif`\n  Make Gif black ve white\n\n•`{i}rvgif`\n  Reverse bir gif\n\n•`{i}vtog`\n  Yanıt ver ile video , It will oluştur Gif\n  video -e Gif\n\n•`{i}gif <query>`\n   Gönder video regarding -e sorgu.\n"
help_globaltools: " -\n\n• `{i}gban <reply user/ username>`\n• `{i}ungban`\n    yasakla/yasağı kaldır Globally.\n\n• `{i}gstat <reply to user/userid/username>`\n   Check eğer kullanıcı  GBanned.\n\n• `{i}listgban` : Liste tümü GBanned kullanıcılar.\n\n• `{i}gmute` | `{i}ungmute` <yanıt kullanıcı/ kullanıcı adı>\n    sustur/susturmayı kaldır Globally.\n\n• `{i}gkick <reply/username>` `Globally Kick User`\n• `{i}gcast <text/reply>` `Globally Send msg in all grps`\n\n• `{i}gadmincast <text/reply>` `Globally broadcast in your admin chats`\n• `{i}gucast <text/reply>` `Globally send msg in all pm users`\n\n• `{i}gblacklist <chat id/username/nothing (for current chat)`\n   ekle sohbet -e blacklist ve ignores global broadcast.\n• `{i}ungblacklist` `Remove the chat from blacklist.`\n\n• `{i}gpromote <reply to user> <channel/group/all> <rank>`\n    globally yükselt kullanıcı burada siz  yönetici\n    - Ayarla whether ile yükselt yalnızca içinde groups/kanallar/tümü.\n    Eg- `gpromote group boss` ~ promotes kullanıcı içinde tümü grps.\n        `gpromote @username all sar` ~ yükselt  kullanıcı içinde tümü grup & kanal\n• `{i}gdemote` - `demote user globally`\n"
help_greetings: " -\n\n---- Welcomes ----\n• `{i}setwelcome <message/reply to message>`\n    Ayarla welcome mesaj içinde  mevcut sohbet.\n\n• `{i}clearwelcome`\n    Sil  welcome içinde  mevcut sohbet.\n\n• `{i}getwelcome`\n    Al  welcome mesaj içinde  mevcut sohbet.\n\n---- GoodByes ----\n• `{i}setgoodbye <message/reply to message>`\n    Ayarla goodbye mesaj içinde  mevcut sohbet.\n\n• `{i}cleargoodbye`\n    Sil  goodbye içinde  mevcut sohbet.\n\n• `{i}getgoodbye`\n    Al  goodbye mesaj içinde  mevcut sohbet.\n\n• `{i}thankmembers on/off`\n    Gönder bir thank siz çıkartma üzerinde hitting bir üyeler count -içinde 100*x içinde sizin groups.\n"
help_imagetools: " -\n\n• `{i}border <reply to photo/sticker>`\n    ile oluştur border around o medya..\n    Ex - `{i}border 12,22,23`\n       - `{i}border 12,22,23 ; width (in number)`\n\n• `{i}grey <reply to any media>`\n    ile make it black nd white.\n\n• `{i}color <reply to any Black nd White media>`\n    ile make it Colorfull.\n\n• `{i}toon <reply to any media>`\n    ile make it toon.\n\n• `{i}danger <reply to any media>`\n    ile make it look Danger.\n\n• `{i}negative <reply to any media>`\n    ile make negative görsel.\n\n• `{i}blur <reply to any media>`\n    ile make it blurry.\n\n• `{i}quad <reply to any media>`\n    oluştur bir Vortex.\n\n• `{i}mirror <reply to any media>`\n    ile oluştur mirror pic.\n\n• `{i}flip <reply to any media>`\n    ile make it flip.\n\n• `{i}sketch <reply to any media>`\n    ile draw its sketch.\n\n• `{i}blue <reply to any media>`\n    just cool.\n\n• `{i}csample <color name /color code>`\n   örnek : `{i}csample red`\n             `{i}csample #ffffff`\n\n• `{i}pixelator <reply image>`\n    oluştur bir Pixelated görsel..\n"
help_instagram: " -\n\n• `{i}ig <Instagram Url>`\n  `Download Instagram posts, reels, TV, or stories`\n\n• isteğe bağlı: ayarla `IG_COOKIES` (cookie dosya yol) süreyle özel/restricted medya\n"
help_locks: " -\n\n• `{i}lock <msgs/media/sticker/gif/games/inline/polls/invites/pin/changeinfo>`\n    Lock  Used ayar içinde Used grup.\n\n• `{i}unlock <msgs/media/sticker/gif/games/inline/polls/invites/pin/changeinfo>`\n    UNLOCK  Used ayar içinde Used grup.\n"
help_logo: " -\n\n• `{i}logo <text>`\n   oluştur bir logo -içinde  verilen metin\n   veya Yanıt ver ile görsel , -e yaz ur metin üzerinde it.\n   veya Yanıt ver ile Font dosya, ile yaz ile o yazı tipi.\n\n"
help_mediatools: " -\n\n• `{i}mediainfo <reply to media>`\n   ile al bilgi hakkında it.\n\n• `{i}rotate <degree/angle> <reply to media>`\n   Rotate herhangi bir video/fotoğraf/medya..\n   Note : süreyle video it should be açı -içinde 90's\n"
help_misc: " -\n\n• `{i}eod`\n    `Get Event of the Today`\n\n• `{i}pntrst <link/id>`\n    İndir ve gönder pinterest pins\n\n• `{i}gadget <search query>`\n    Gadget Ara -den Telegram.\n\n• `{i}randomuser`\n   oluştur ayrıntılar hakkında bir rastgele kullanıcı.\n\n• `{i}ascii <reply image>`\n    Convert replied görsel into html.\n"
help_mute: " -\n\n• `{i}mute <reply to msg/ user id>`\n    sustur kullanıcı içinde mevcut sohbet.\n\n• `{i}unmute <reply to msg/ user id>`\n    susturmayı kaldır kullanıcı içinde mevcut sohbet.\n\n• `{i}dmute <reply to msg/ user id>`\n    sustur kullanıcı içinde mevcut sohbet by deleting msgs.\n\n• `{i}undmute <reply to msg/ use id>`\n    susturmayı kaldır dmuted kullanıcı içinde mevcut sohbet.\n\n• `{i}tmute <time> <reply to msg/ use id>`\n    s- saniye\n    m- dakika\n    h- saat\n    d- gün\n    sustur kullanıcı içinde mevcut sohbet ile zaman.\n"
help_notes: " -\n\n• `{i}addnote <word><reply to a message>`\n    ekle not içinde  kullanılan sohbet ile replied mesaj ve choosen kelime.\n\n• `{i}remnote <word>`\n    Kaldır  not -den kullanılan sohbet.\n\n• `{i}listnote`\n    listele tümü notlar.\n\n• kullan :\n   ayarla notlar içinde grup so tümü -ebilir kullan it.\n   tür `#(Keyword of note)` -e al it\n"
help_other: " -\n\n• `{i}send <username/id> <reply/type>`\n    gönder mesaj -e kullanıcı/sohbet.\n\n• `{i}fwdreply <reply to msg>`\n    Yanıt ver -e birinin mesajı by iletme it içinde özel.\n\n• `{i}save <reply message>`\n    Kaydet o replied msg -e ur saved mesajlar box.\n\n• `{i}fsave <reply message>`\n    ilet o replied msg -e ur saved mesajlar.\n"
help_pmpermit: " -\n\n• `{i}a` veya `{i}approve`\n    onayla birisi -e PM.\n\n• `{i}da` veya `{i}disapprove`\n    Disapprove birisi -e PM.\n\n• `{i}block`\n    engelle birisi.\n\n• `{i}unblock` | `{i}unblock all`\n    engeli kaldır birisi.\n\n• `{i}nologpm`\n    Durdur logging mesajlar -den  kullanıcı.\n\n• `{i}logpm`\n    Başlat logging mesajlar -den  kullanıcı.\n\n• `{i}startarchive`\n    Archive yeni PMs.\n\n• `{i}stoparchive`\n    Don't arşivle yeni PMs.\n\n• `{i}cleararchive`\n    Unarchive tümü chats.\n\n• `{i}listapproved`\n   Liste tümü approved PMs.\n"
help_polls: " -\n\n• `{i}poll <question> ; <option> ; <option>`\n    Al  Anonymous Poll ile verilen seçenekler\n\n• `{i}poll <question> ; <option> ; <option> | <type>`\n    Al  anket belirtilen ile desired tür!\n    tür should be herhangi bir -içinde  `public`,  `multiple` veya `quiz`\n\n• `{i}poll <question> ; <option> ; <option> | quiz_<answerno>`\n    Al  quiz anket burada answerno   sayı -içinde seçenek which  doğru\n\n"
help_profile: " -\n\n• `{i}setname <first name // last name>`\n    değiştir sizin profil ad.\n\n• `{i}setbio <bio>`\n    değiştir sizin profil bio.\n\n• `{i}setpic <reply to pic>`\n    değiştir sizin profil pic.\n\n• `{i}delpfp <n>(optional)`\n    Sil one profil pic, eğer yok değer verilen, else sil n sayı -içinde pics.\n\n• `{i}poto <username>`\n    Yükle  fotoğraf -içinde sohbet/kullanıcı eğer Mevcut.\n"
help_qrcode: " -\n\n• `{i}qrcode <text/reply to text>`\n   `Makes qrcode of text`\n\n• `{i}addqr <reply image> <text>`\n   `Makes qr of text and add it to image.`\n\n• `{i}qrdecode <reply to qrcode>`\n   `It decodes the qrcode.`\n"
help_resize: " -\n\n•`{i}size <reply to media>`\n   ile al boyut -içinde it.\n\n•`{i}resize <number> <number>`\n   ile yeniden boyutlandır görsel üzerinde x, y axis.\n   eg. `{i}resize 690 960`\n"
help_schedulemsg: " -\n\n•`{i}schedule <text/reply to msg> <time>`\n    içinde zaman u -ebilir kullan saniye as sayı, veya gibi 1h veya 1m\n    eg. `{i}schedule Hello 100` It deliver msg after 100 sec.\n    eg. `{i}schedule Hello 1h` It deliver msg after bir saat.\n"
help_search: " -\n\n• `{i}saavn <search query>`\n    İndir şarkılar -den Saavn.\n\n• `{i}google <query>`\n    için doing google ara.\n\n• `{i}github <username>`\n    Al full bilgi -içinde  kullanıcılar github profil.\n\n• `{i}img <query>`\n  `{i}img <query> ; <no of results>`\n    için doing Images ara.\n\n• `{i}reverse`\n    Yanıt ver bir görsel veya çıkartma -e find its sauce.\n"
help_snips: " -\n\n• `{i}addsnip <word><reply to a message>`\n    ekle  kullanılan kelime as snip relating -e replied mesaj.\n\n• `{i}remsnip <word>`\n    Kaldır  snip kelime..\n\n• `{i}listsnip`\n    listele tümü snips.\n\n• kullan :\n    tür `$(ur snip word)` al setted yanıt.\n"
help_specialtools: " -\n\n• `{i}wspr <username>`\n    Gönder secret mesaj..\n\n• `{i}q <color-optional>`\n• `{i}q @username`\n• `{i}q r <color-optional>`\n• `{i}q count` : `multiple quotes`\n    oluştur quotes..\n\n• `{i}sticker <query>`\n    Ara Stickers as Per ur Wish..\n\n• `{i}getaudio <reply to an audio>`\n    İndir ses ile put içinde ur Desired video/Gif.\n\n• `{i}addaudio <reply to Video/gif>`\n    It will put  yukarıdaki ses -e  replied video/gif.\n\n• `{i}dob <date of birth>`\n    Put içinde dd/mm/yy biçim yalnızca(eg .dob 01/01/1999).\n\n• `{i}wall <query>`\n    Ara Hd Wallpaper as Per ur Wish..\n"
help_stickertools: " -\n\n• `{i}destroy <reply to animated sticker>`\n    ile destroy  çıkartma.\n\n• `{i}tiny <reply to media>`\n    ile oluştur Tiny stickers.\n\n• `{i}kang <reply to image/sticker>`\n    Kang  çıkartma (ekle -e sizin paket).\n\n• `{i}packkang <pack name>`\n    Kang  Complete çıkartma seti (ile özel ad).\n\n• `{i}round <reply to any media>`\n    ile extract yuvarlak çıkartma.\n"
help_sudo: " -\n\n• `{i}addsudo`\n    ekle Sudo kullanıcılar by replying -e kullanıcı veya kullanarak <boşluk> separated kullanıcı kimliği(s)\n\n• `{i}delsudo`\n    Kaldır Sudo kullanıcılar by replying -e kullanıcı veya kullanarak <boşluk> separated kullanıcı kimliği(s)\n\n• `{i}listsudo`\n    Liste tüm Sudo kullanıcıları.\n"
help_tag: " -\n\n• `{i}tagall`\n    Tag Top 100 üyeler -içinde sohbet.\n\n• `{i}tagadmins`\n    Tag yöneticiler -içinde o sohbet.\n\n• `{i}tagowner`\n    Tag sahip -içinde o sohbet\n\n• `{i}tagbots`\n    Tag Botlar -içinde o sohbet.\n\n• `{i}tagrec`\n    Tag yakın zamanda etkin üyeler.\n\n• `{i}tagon`\n    Tag çevrimiçi üyeler(work yalnızca eğer gizlilik kapalı).\n\n• `{i}tagoff`\n    Tag çevrimdışı üyeler(work yalnızca eğer gizlilik kapalı).\n"
help_tools: " -\n\n• `{i}circle`\n    Yanıt ver -e bir ses şarkı veya gif -e al video mesajı.\n\n• `{i}ls`\n    Al tümü  dosyalar inside bir dizin.\n\n• `{i}bots`\n    Shows  sayı -içinde bots içinde  mevcut sohbet ile their kalıcı bağlantı.\n\n• `{i}hl <a link> <text-optional>`\n    Embeds  bağlantı ile bir boşluk as mesaj.\n\n• `{i}id`\n    Yanıt ver bir çıkartma -e Al Its kimlik\n    Yanıt ver bir kullanıcı -e Al His kimlik\n    olmadan Replying siz Will Al  sohbet's kimlik\n\n• `{i}sg <reply to a user><username/id>`\n    Al His ad geçmiş -içinde  replied kullanıcı.\n\n• `{i}tr <dest lang code> <(reply to) a message>`\n    Al çevrilmiş mesaj.\n\n• `{i}webshot <url>`\n    Al bir ekran görüntüsü -içinde  web sayfası.\n\n• `{i}shorturl <url> <id-optional>`\n    kısalt herhangi bir URL...\n"
help_unsplash: " -\n\n• {i}unsplash <arama sorgusu> ; <görsel sayısı>\n    Unsplash görsel Ara.\n"
help_usage: "\n\n• `{i}usage`\n    Al genel kullanım.\n\n• `{i}usage heroku`\n   Al heroku istatistikler.\n\n• `{i}usage db`\n   Al veritabanı depolama kullanımı.\n"
help_utilities: " -\n\n• `{i}kickme` : Leaves  grup.\n\n• `{i}date` : göster Calender.\n\n• `{i}listreserved`\n    Liste tümü usernames (kanallar/groups) siz own.\n\n• `{i}stats` : See sizin profil istatistikleri.\n\n• `{i}paste` - `Include long text / Reply to text file.`\n\n• `{i}info <username/userid/chatid>`\n    Yanıt ver -e birinin mesajı.\n\n• `{i}invite <username/userid>`\n    ekle kullanıcı -e  sohbet.\n\n• `{i}rmbg <reply to pic>`\n    Kaldır arka plan -den o picture.\n\n• `{i}telegraph <reply to media/text>`\n    Yükle medya/metin -e Telegraph.\n\n• `{i}json <reply to msg>`\n    Al  JSON kodlaması -içinde  mesaj.\n\n• `{i}suggest <reply to message> or <poll title>`\n    oluştur bir Evet/Hayır anketi süreyle  replied suggestion.\n\n• `{i}ipinfo <ipAddress>` : Al bilgi hakkında o IP adresi.\n\n• `{i}cpy <reply to message>`\n   kopyala  replied mesaj, ile formatting. Expires içinde 24hrs.\n• `{i}pst`\n   yapıştır  copied mesaj, ile formatting.\n\n• `{i}thumb <reply file>` : İndir  küçük resim -içinde  replied dosya.\n\n• `{i}getmsg <message link>`\n  Al mesajlar -den chats ile ilet/kopyala kısıtlamalar.\n"
help_variables: " -\n\n• `{i}get var <variable name>`\n   Al değer -içinde  verilen değişken ad.\n\n• `{i}get type <variable name>`\n   Al değişken tür.\n\n• `{i}get db <key>`\n   Al db değer -içinde  verilen anahtar.\n\n• `{i}get keys`\n   Al tümü Redis anahtarları.\n"
help_vctools: " -\n\n• `{i}startvc`\n    Başlat grup Call içinde bir grup.\n\n• `{i}stopvc`\n    Durdur grup Call içinde bir grup.\n\n• `{i}vctitle <title>`\n    değiştir  başlık grup arama.\n\n• `{i}vcinvite`\n    Invite tümü üyeler -içinde grup içinde grup Call.\n    (Katılmış olmanız gerekir)\n"
help_videotools: " -\n\n•`{i}sample <duration in seconds>`\n   Creates kısa örnek -içinde video..\n\n• `{i}vshots <number of shots>`\n   Creates ekran görüntüsü -içinde video..\n\n• `{i}vtrim <start time> - <end time> in seconds`\n    Crop bir Lengthy video..\n"
help_warn: "\n\n•`{i}warn <reply to user> <reason>`\n    Gives Warn.\n\n•`{i}resetwarn <reply to user>`\n    ile sıfırla tümü Warns.\n\n•`{i}warns <reply to user>`\n   ile Al Liste -içinde uyarılar -içinde bir kullanıcı.\n\n•`{i}setwarn <warn count> | <ban/mute/kick>`\n   Ayarla sayı içinde uyarı sayısı süreyle uyarılar\n   After putting ' | ' mark put işlem gibi yasakla/sustur/at\n   Its varsayılan 3 at\n   Örnek: `setwarn 5 | mute`\n\n"
help_webupload: " -\n\n• `{i}webupload`\n    Yükle dosyalar üzerinde başka bir sunucu.\n"
help_words: " -\n\n• `{i}meaning <word>`\n    Al  anlam -içinde  kelime.\n\n• `{i}synonym <word>`\n    Al tüm eş anlamlılar.\n\n• `{i}antonym <word>`\n    Al tüm zıt anlamlılar.\n\n• `{i}ud <word>`\n    Fetch kelime defenition -den urbandictionary.\n"
help_ziptools: "\n\n• `{i}zip <reply to file>`\n    zip  replied dosya\n    ile ayarla şifre üzerinde zip: `{i}zip <password>` yanıt -e dosya\n\n• `{i}unzip <reply to zip file>`\n    zip aç  replied dosya.\n\n• `{i}azip <reply to file>`\n   ekle dosya -e toplu süreyle toplu yükleme zip\n\n• `{i}dozip`\n   yükleme toplu zip  dosyalar u eklendi -den `{i}azip`\n   ile ayarla Password: `{i}dozip <password>`\n\n"
