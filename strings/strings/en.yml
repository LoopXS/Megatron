session_ask_api_hash: "➋ Now send your **API Hash** (the 32-character value from my.telegram.org).\n\nSend /cancel to abort."
session_bad_api_hash: "✖️ That is not a valid API Hash. It must be exactly 32 hexadecimal characters."
session_ask_phone: "➌ Send the **phone number** in international format, e.g. `+12025550123`.\n\nSend /cancel to abort."
