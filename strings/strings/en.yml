# Help Menus

cmda: "✘ Commands Available"
help_admintools: "-\n\n• `.promote <reply to user/userid/username>`\n• `.demote`\n    Promote/Demote the user in the chat.\n\n• `.ban <reply to user/userid/username> <reason>`\n• `.unban`\n    Ban/Unban the user from the chat.\n\n• `.kick <reply to user/userid/username> <reason>`\n    Kick the user from the chat.\n\n• `.pin <reply to message>`\n    Pin the message in the chat\n• `.tpin <time> <temp pin message>`\n• `.unpin (all) <reply to message>`\n    Unpin the messages in the chat.\n\n• `.pinned`\n   Get pinned message in the current chat.\n• `.listpinned`\n   Get all pinned messages in current chat\n\n• `.autodelete <24h/7d/1m/off>`\n   Enable Auto Delete Messages in Chat.\n\n• `.purge <reply to message>`\n    Purge all messages from the replied message.\n\n• `.purgeme <reply to message>`\n    Purge Only your messages from the replied message.\n\n• `.purgeall`\n    Delete all msgs of replied user.\n\n• `.mypurge`\n    Delete all your msgs .\n"
help_afk: " -\n\n• `{i}afk <optional reason>`\n    AFK means away from keyboard,\n    After this is activated, if someone tags or messages you, he/she would get an automated reply from the bot.\n\n    (Note : Set a media file in afk messages by replying to any media with `{i}afk <reason>`).\n\n"
help_antiflood: " -\n\n• `{i}setflood <integer>`\n    Set flood limit in a chat.\n\n• `{i}remflood`\n    Remove flood limit from a chat.\n\n• `{i}getflood`\n    Get flood limit of a chat.\n"
help_asstcmd: " -\n\n•`{i}addcmd <new cmd> <reply>`\n   It will set new cmd for your assistant bot with that reply message.\n\n•`{i}remcmd <cmd name>`\n   It will remove your cmd.\n\n•`{i}listcmd`\n   To Get list of all your custom cmd.\n"
help_asst_cmd: " -\n\n•`{i}addcmd <new cmd> <reply>`\n   It will set new cmd for your assistant bot with that reply message.\n\n•`{i}remcmd <cmd name>`\n   It will remove your cmd.\n\n•`{i}listcmd`\n   To Get list of all your custom cmd.\n"
help_audiotools: "✘ Commands Available - \n`.makevoice <reply to audio>`\n   creates a voice note from Audio.\n\n`.atrim <from time> - <to time>`\n   trim audio as per given time.\n   time must be in seconds. `.atrim 50-70`\n\n`.extractaudio <reply to media>`\n   To extract the audio from it.\n\n"
help_autoban: "\n\n• `{i}autokick <on/off>`\n    on - To enable.\n    off - To disable.\n    Automatically kick new joined users from the group.\n"
help_autopic: " -\n\n• `{i}autopic <search query>`\n    Search Google Images and rotate your profile photo from the results.\n\n• `{i}autopic`\n    Stop the running autopic loop.\n"
help_beautify: " -\n\n• `{i}carbon <text/reply to msg/reply to document>`\n    Carbonise the text with default settings.\n\n• `{i}rcarbon <text/reply to msg/reply to document>`\n    Carbonise the text, with random bg colours.\n\n• `{i}ccarbon <color ><text/reply to msg/reply to document>`\n    Carbonise the text, with custom bg colours.\n\n• `{i}rayso <opt-theme> <text>/<reply to message>`\n  `{i}rayso list` - `Get list of themes.`\n"
help_blacklist: " -\n\n• `{i}blacklist <word/all words with a space>`\n    blacklist the choosen word in that chat.\n\n• `{i}remblacklist <word>`\n    Remove the word from blacklist..\n\n• `{i}listblacklist`\n    list all blacklisted words.\n\n  'if a person uses blacklist Word his/her msg will be deleted'\n  'And u Must be Admin in that Chat'\n"
help_bot: "\n\n• `{i}alive` | `{i}alive inline`\n    Check if your bot is working.\n\n• `{i}ping`\n    Check bot response time.\n\n• `{i}update`\n    See changelogs if any update is available.\n\n• `{i}cmds`\n    View all plugin names.\n\n• `{i}restart`\n    To restart your bot.\n\n• `{i}logs (sys)`\n    Get the full terminal logs.\n• `{i}logs carbon`\n    Get the carbonized sys logs.\n• `{i}logs heroku`\n   Get the latest 100 lines of heroku logs.\n\n• `{i}shutdown`\n    Turn off your bot.\n"
help_broadcast: "\n\n• `{i}addch <id/reply to list/none>`\n    Add chat to database. Adds current chat if no id specified.\n\n• `{i}remch <all/id/none>`\n    Removes the specified chat (current chat if none specified), or all chats.\n\n• `{i}broadcast <reply to msg>`\n    Send the replied message to all chats in database.\n\n• `{i}forward <reply to msg>`\n     Forward the message to all chats in database.\n\n• `{i}listchannels`\n    To get list of all added chats.\n"
help_button: " -\n\n• `{i}button <text with button format`\n   create button u can reply to pic also\n\nFormat:- `{i}button Hey There! @DarkPentesterBot 😎.\n[AssisXBot | t.me/AssisXBot][Support | t.me/AssisXBot | same]\n[AssisXBot | t.me/AssisXBot]`\n"
help_calculator: " -\n\n•`{i}calc` - Inline Calculator\n\n"
help_channelhacks: "\n\n🔹 `{i}shift <from channel> | <to channel>`\n     This will transfer all old post from channel A to channel B.\n      (u can use username or id of channel too)\n      example : `{i}shift @abc | @xyz`\n      [note - this (' | ') sign is nessesary]\n\n🔹 For auto-posting/forwarding all new message from any source channel to any destination channel.\n\n   `{i}asource <channel username or id>`\n      This add source channel to database\n   `{i}dsource <channel username or id>`\n      This remove source channels from database\n   `{i}listsource <channel username or id>`\n      Show list of source channels\n\n\n   `{i}adest <channel username or id>`\n      This add Ur channels to database\n   `{i}ddest <channel username or id>`\n      This Remove Ur channels from database\n   `{i}listdest <channel username or id>`\n      Show List of Ur channels\n\n   'you can set many channels in database'\n   'For activating auto-post use `{i}setdb AUTOPOST True` '\n"
help_chatbot: " -\n\n• `{i}addai <reply to user/give username/userid>`\n   Add a AI ChatBot to reply to that user.\n\n• `{i}remai <reply to user/give username/userid>`\n   Remove the AI ChatBot.\n\n• `{i}repai <reply to user/give a message>`\n   Reply to the user with a message by an AI.\n\n• `{i}listai`\n   List the currently AI added users.\n"
help_chats: " -\n\n• `{i}delchat <optional- username/id>`\n    Delete the group this cmd is used in.\n\n• `{i}getlink`\n• `{i}getlink r` - `create link with admin approval`\n• `{i}getlink r title_here` - `admin approval with link title`\n• `{i}getlink 10` - `usage limit in new link`\n    Get link of group this cmd is used in.\n\n• `{i}create (g|b|c) <group_name> ; <optional-username>`\n    Create group woth a specific name.\n    g - megagroup/supergroup\n    b - small group\n    c - channel\n\n• `{i}setgpic <reply to Photo><chat username>`\n    Set Profile photo of Group.\n\n• `{i}delgpic <chat username -optional>`\n    Delete Profile photo of Group.\n\n• `{i}unbanall`\n    Unban all Members of a group.\n\n• `{i}rmusers`\n    Remove users specifically.\n"
help_cleanaction: " -\n\n•`{i}addclean`\n    Clean all Upcoming action msg in added chat like someone joined/left/pin etc.\n\n•`{i}remclean`\n    Remove chat from database.\n\n•`{i}listclean`\n   To get list of all chats where its activated.\n\n"
help_compressor: " -\n\n• `{i}compress`\n    Reply to a video to compress it (default CRF 27).\n\n• `{i}compress <crf>`\n    Compress with a custom CRF value (lower = better quality / larger file).\n\n• `{i}compress <crf> stream`\n    Compress and re-upload as a streamable video.\n"
help_converter: " -\n\n• `{i}convert <gif/img/sticker/webm>`\n    Reply to media to convert it into gif / image / webm / normal sticker.\n\n• `{i}doc <filename.ext>`\n    Reply to a text msg to save it in a file.\n\n• `{i}open`\n    Reply to a file to reveal it's text.\n\n• `{i}rename <file name with extension>`\n    Rename the file\n\n• `{i}thumbnail <reply to image/thumbnail file>`\n    Upload Your file with your custom thumbnail.\n"
help_core: " -\n\n• `{i}install <reply to plugin>`\n    To install the plugin,\n  `{i}install f`\n    To force Install.\n\n• `{i}uninstall <plugin name>`\n    To unload and remove the plugin.\n\n• `{i}load <plugin name>`\n    To load unloaded unofficial plugin.\n\n• `{i}unload <plugin name>`\n    To unload unofficial plugin.\n\n• `{i}help <plugin name>`\n    Shows you a help menu (like this) for every plugin.\n\n• `{i}getaddons <raw link to code>`\n    Load Plugins from the given raw link.\n"
help_database: " -\n\n• **DataBase Commands, do not use if you don't know what it is.**\n\n• `{i}setdb key | value`\n    Set Value in Database.\n    e.g :\n    `{i}setdb hi there`\n    `{i}setdb hi there | heartless here`\n    `{i}setdb --extend variable value` or `{i}setdb -e variable value` to add the value to the exiting values in db.\n\n• `{i}deldb key`\n    Delete Key from DB.\n\n• `{i}rendb old keyname | new keyname`\n    Update Key Name\n"
help_devtools: " -\n\n• `{i}bash <cmds>`\n• `{i}bash -c <cmds>` Carbon image as command output.\n    Run linux commands on telegram.\n\n• `{i}eval <code>`\n    Evaluate python commands on telegram.\n    Shortcuts:\n        client = bot = event.client\n        e = event\n        p = print\n        reply = await event.get_reply_message()\n        chat = event.chat_id\n\n• `{i}cpp <code>`\n    Run c++ code from Telegram.\n\n• `{i}sysinfo`\n    Shows System Info.\n"
help_downloadupload: " -\n\n• `{i}ul <path/to/file>`\n    Upload files on telegram.\n    Use following arguments before or after filename as per requirement:\n      `--stream` to upload as stream.\n      `--delete` to delete file after uploading.\n      `--no-thumb` to upload without thumbnail.\n\n• `{i}dl <filename(optional)>`\n    Reply to file to download.\n\n• `{i}download <DDL> (| filename)`\n    Download using DDL. Will autogenerate filename if not given.\n"
help_echo: "\n\n•`{i}addecho <reply to anyone>`\n   Start Auto Echo message of Replied user.\n\n•`{i}remecho <reply to anyone>`\n   Turn It off\n\n•`{i}listecho <reply to anyone>`\n   To Get list.\n"
help_extra: " -\n\n• `{i}del <reply to message>`\n    Delete the replied message.\n\n• `{i}edit <new message>`\n    Edit your last message or replied msg.\n\n• `{i}copy <reply to message>`\n    Copy replied message / media.\n\n• `{i}reply`\n    Reply the last sent msg to replied user.\n"
help_fakeaction: " -\n\n<b>Fake Actions</b>\n\n• `{i}ftyping [time]`\n• `{i}faudio [time]`\n• `{i}fvideo [time]`\n• `{i}fgame [time]`\n• `{i}fsticker [time]`\n• `{i}flocation [time]`\n• `{i}fcontact [time]`\n• `{i}fround [time]`\n• `{i}fphoto [time]`\n• `{i}fdocument [time]`\n    `Show the selected Telegram action for the specified duration.`\n\n<b>Time</b>\n    `<number>` = seconds\n    `<number>s` = seconds\n    `<number>m` = minutes\n    `<number>h` = hours\n    `<number>d` = days\n\n    `Examples:`\n    `{i}ftyping 10`\n    `{i}ftyping 30s`\n    `{i}ftyping 5m`\n    `{i}ftyping 2h`\n    `{i}ftyping 1d`\n\n<b>Target</b>\n    `Actions can be sent to the current chat or a specific user/chat.`\n\n    `{i}ftyping @username 10`\n    `{i}ftyping 123456789 10`\n    `{i}ftyping 10 @username`\n    `{i}ftyping 10 123456789`\n\n    `Username and numeric Telegram ID are supported.`\n\n<b>Default Duration</b>\n    `{i}ftyping`\n    `If no duration is specified, the default duration is used.`\n\n<b>Stop Normal Action</b>\n    `{i}ftyping off`\n    `{i}ftyping off @username`\n    `{i}ftyping off 123456789`\n    `Use off to stop an active fake action.`\n\n<b>ALL Mode</b>\n    `{i}all ftyping 10`\n    `Run Fake Typing automatically whenever a new incoming message is received.`\n\n    `{i}all ftyping 10h`\n    `Keep the fake action active for 10 hours whenever a new message triggers it.`\n\n    `{i}all ftyping @username 10`\n    `{i}all ftyping 10 @username`\n    `Only messages from the specified user trigger the action.`\n\n    `{i}all ftyping 123456789 10`\n    `A numeric user ID can also be used as the trigger target.`\n\n<b>Stop ALL Mode</b>\n    `{i}all ftyping off`\n    `{i}all faudio off`\n    `{i}all fvideo off`\n    `The same format works with every Fake Action.`\n\n<b>FSeen</b>\n    `{i}fseen`\n    `In a private chat, automatically mark new messages from that user as read.`\n\n    `{i}fseen @username`\n    `{i}fseen 123456789`\n    `Monitor a specific user by username or numeric ID.`\n\n    `In groups, reply to the user's message and use {i}fseen.`\n\n<b>FSeen ALL Mode</b>\n    `{i}all fseen`\n    `{i}all fseen @username`\n    `{i}all fseen 123456789`\n    `Automatically mark new messages from the selected user as read.`\n\n    `ALL mode only reacts to messages received after activation.`\n\n<b>Stop FSeen</b>\n    `{i}fseen off`\n    `{i}fseen off @username`\n    `{i}fseen off 123456789`\n    `Stops automatic read acknowledgement for the selected user.`\n\n<b>Stop FSeen ALL Mode</b>\n    `{i}all fseen off`\n    `{i}all fseen off @username`\n    `{i}all fseen off 123456789`\n    `Stops the selected FSeen ALL watcher.`\n\n<b>Notes</b>\n    `• ALL mode applies only to messages received after activation.`\n    `• A new message in the same chat replaces the previous fake-action task.`\n    `• Fake Telegram actions are chat-wide and cannot be displayed to only one member of a group.`\n    `• FSeen uses Telegram's read acknowledgement system.`\n    `• Numeric IDs may require the account to have previously encountered or have access to the target entity.`\n    `• Each Fake Action can have its own independent ALL mode.`\n"
help_fedutils: " -\n\n• `{i}superfban <reply to user/userid/username>`\n    FBan the person across all feds in which you are admin.\n\n• `{i}superunfban <reply to user/userid/username>`\n    Un-FBan the person across all feds in which you are admin.\n\nSpecify FBan Group and Feds to exclude in the assistant.\n\n• `{i}fstat <username/id/reply to user>`\n    Collect fed stat of the person in Rose.\n\n• `{i}fedinfo <(fedid)>`\n    Collect federation info of the given fed id, or of the fed you own, from Rose.\n"
help_fileshare: " -\n\n• `{i}fs <query>`\n    `Search your saved/shared files by name.`\n\n• `{i}fileshare <query>`\n    `Same as fs. Search and share files inline.`\n\n• `{i}fs`\n    `Open the Fileshare inline interface and browse your available files.`\n\n**Inline Mode:**\n    `All Fileshare operations are designed to work inline.`\n\n    `Type the command followed by your query and choose a result from the inline list.`\n\n    `Example:`\n    `{i}fs song`\n    `{i}fs movie`\n    `{i}fs document`\n\n**Search:**\n    `{i}fs <name>`\n    `Search files by their filename or stored title.`\n\n    `{i}fs pdf`\n    `{i}fs photo`\n    `{i}fs myfile`\n\n    `The search is case-insensitive and supports partial names.`\n\n**File Types:**\n    `Files can be searched and displayed according to their media type.`\n\n    `Supported categories may include:`\n    `Documents, Photos, Videos, Audio, Voice, Archives and other files.`\n\n**Pagination:**\n    `If more files are available than can be displayed at once, use the navigation buttons in the inline interface to load the next or previous page.`\n\n    `Pagination prevents large file collections from slowing down the inline search.`\n\n<**File Information:**\n    `Each result can display useful information about the file, including:`\n    `Filename, file type, size, duration when available, and other available metadata.`\n\n**Sharing:**\n    `Select any file from the inline results to send/share it in the current chat.`\n\n    `Files are shared using Telegram's stored media whenever possible, avoiding unnecessary re-uploads.`\n\n**Inline Search Examples:**\n    `{i}fs linux`\n    `{i}fs tutorial`\n    `{i}fs mp3`\n    `{i}fs .zip`\n    `{i}fs 1080p`\n\n**Exact Search:**\n    `Use the complete filename when you want to find a specific file.`\n\n    `{i}fs Ubuntu 24.04.iso`\n    `{i}fs My Document.pdf`\n\n**Partial Search:**\n    `You can also provide only a part of the filename.`\n\n    `{i}fs Ubuntu`\n    `{i}fs Document`\n    `{i}fs tutorial`\n\n**Media Filtering:**\n    `Use a media type or extension as part of the search query to narrow the results.`\n\n    `{i}fs mp4`\n    `{i}fs mp3`\n    `{i}fs pdf`\n    `{i}fs zip`\n    `{i}fs jpg`\n\n**File Management:**\n    `Files stored by Fileshare can be managed without manually searching through Telegram messages.`\n\n    `The inline interface provides the available management actions for supported files.`\n\n**Delete:**\n    `Use the delete option available in the file's inline controls to remove a stored file when supported.`\n\n    `Deletion requires confirmation to prevent accidental removal.`\n\n**Cleanup:**\n    `The cleanup option can be used to remove obsolete or unwanted stored entries when supported by the plugin.`\n\n    `Use cleanup carefully because removed entries may no longer appear in Fileshare search results.`\n\n**File Details:**\n    `Open the details option from an inline result to inspect the stored information before sharing or managing the file.`\n\n**Quick Usage:**\n    `1. Open any Telegram chat.`\n    `2. Start the Fileshare inline command.`\n    `3. Enter the filename or part of the filename.`\n    `4. Select the desired file from the results.`\n    `5. Telegram sends the selected file to the current chat.`\n\n**Performance:**\n    `Fileshare uses indexed/searchable stored information so large collections can be searched without loading every file into memory for every request.`\n\n    `Pagination and controlled result limits are used to keep inline responses fast.`\n\n**Notes:**\n    `Search results depend on the files available to Fileshare and the metadata stored for each file.`\n    `A file that has been deleted from the underlying Telegram storage may no longer be shareable.`\n    `Very large files may be subject to Telegram's own file and account limitations.`\n    `Inline results are generated dynamically and may be cached according to the plugin configuration.`\n    `If a result becomes invalid, refresh the inline search and try again.`\n"
help_filter: " -\n\n• `{i}addfilter <word><reply to a message>`\n    add the used word as filter relating to replied message.\n\n• `{i}remfilter <word>`\n    Remove the filtered user..\n\n• `{i}listfilter`\n    list all filters.\n"
