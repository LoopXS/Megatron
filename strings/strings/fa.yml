# Help Menus

cmda: "✘ دستورات موجود"
help_admintools: "-\n\n• `.promote <reply to user/userid/username>`\n• `.demote`\n    کاربر را در چت ارتقا/تنزل دهید.\n\n• `.ban <reply to user/userid/username> <reason>`\n• `.unban`\n    کاربر را از چت بن/آن‌بن کنید.\n\n• `.kick <reply to user/userid/username> <reason>`\n    کاربر را از چت کیک کنید.\n\n• `.pin <reply to message>`\n    پیام را در چت پین کنید.\n• `.tpin <time> <temp pin message>`\n• `.unpin (all) <reply to message>`\n    پیام‌های پین‌شده را در چت آن‌پین کنید.\n\n• `.pinned`\n   پیام پین‌شده در چت فعلی را دریافت کنید.\n• `.listpinned`\n   همه پیام‌های پین‌شده در چت فعلی را دریافت کنید.\n\n• `.autodelete <24h/7d/1m/off>`\n   حذف خودکار پیام‌ها را در چت فعال کنید.\n\n• `.purge <reply to message>`\n    همه پیام‌ها از پیام ریپلای‌شده به بعد را پاک کنید.\n\n• `.purgeme <reply to message>`\n    فقط پیام‌های خودتان را از پیام ریپلای‌شده به بعد پاک کنید.\n\n• `.purgeall`\n    همه پیام‌های کاربر ریپلای‌شده را حذف کنید.\n\n• `.mypurge`\n    همه پیام‌های خودتان را حذف کنید.\n"
help_afk: " -\n\n• `{i}afk <optional reason>`\n    AFK یعنی دور از کیبورد؛\n    پس از فعال‌سازی، اگر کسی شما را تگ کند یا برایتان پیام بفرستد، ربات به‌صورت خودکار پاسخ می‌دهد.\n\n    (نکته: برای پیام‌های AFK یک فایل مدیا تنظیم کنید؛ کافی است با `{i}afk <reason>` به هر مدیایی ریپلای کنید).\n\n"
help_antiflood: " -\n\n• `{i}setflood <integer>`\n    محدودیت Flood را در یک چت تنظیم کنید.\n\n• `{i}remflood`\n    محدودیت Flood را از چت حذف کنید.\n\n• `{i}getflood`\n    محدودیت Flood چت را دریافت کنید.\n"
help_asstcmd: " -\n\n•`{i}addcmd <new cmd> <reply>`\n   با پیام ریپلای‌شده، یک دستور جدید برای ربات دستیار خود تنظیم کنید.\n\n•`{i}remcmd <cmd name>`\n   دستور سفارشی خود را حذف کنید.\n\n•`{i}listcmd`\n   فهرست همه دستورات سفارشی خود را دریافت کنید.\n"
help_audiotools: "✘ دستورات موجود - \n`.makevoice <reply to audio>`\n   از فایل صوتی، Voice Note بسازید.\n\n`.atrim <from time> - <to time>`\n   صوت را بر اساس زمان مشخص‌شده برش دهید.\n   زمان باید برحسب ثانیه باشد. `.atrim 50-70`\n\n`.extractaudio <reply to media>`\n   صوت را از مدیا استخراج کنید.\n\n"
help_autoban: "\n\n• `{i}autokick <on/off>`\n    on - فعال‌سازی.\n    off - غیرفعال‌سازی.\n    کاربران تازه‌وارد را به‌صورت خودکار از گروه کیک می‌کند.\n"
help_beautify: " -\n\n• `{i}carbon <text/reply to msg/reply to document>`\n    متن را با تنظیمات پیش‌فرض به Carbon تبدیل کنید.\n\n• `{i}rcarbon <text/reply to msg/reply to document>`\n    متن را با رنگ پس‌زمینه تصادفی به Carbon تبدیل کنید.\n\n• `{i}ccarbon <color ><text/reply to msg/reply to document>`\n    متن را با رنگ پس‌زمینه سفارشی به Carbon تبدیل کنید.\n\n• `{i}rayso <opt-theme> <text>/<reply to message>`\n  `{i}rayso list` - `فهرست تم‌ها را دریافت کنید.`\n"
help_blacklist: " -\n\n• `{i}blacklist <word/all words with a space>`\n    کلمه انتخاب‌شده را در آن چت در لیست سیاه قرار دهید.\n\n• `{i}remblacklist <word>`\n    کلمه را از لیست سیاه حذف کنید..\n\n• `{i}listblacklist`\n    فهرست همه کلمات لیست سیاه را دریافت کنید.\n\n  'اگر شخصی از کلمه موجود در لیست سیاه استفاده کند، پیام او حذف می‌شود'\n  'و شما باید در آن چت ادمین باشید'\n"
help_bot: "\n\n• `{i}alive` | `{i}alive inline`\n    بررسی کنید ربات شما کار می‌کند یا نه.\n\n• `{i}ping`\n    زمان پاسخ‌گویی ربات را بررسی کنید.\n\n• `{i}update`\n    اگر به‌روزرسانی‌ای موجود باشد، Changelog را ببینید.\n\n• `{i}cmds`\n    نام همه پلاگین‌ها را مشاهده کنید.\n\n• `{i}restart`\n    ربات خود را راه‌اندازی مجدد کنید.\n\n• `{i}logs (sys)`\n    لاگ کامل ترمینال را دریافت کنید.\n• `{i}logs carbon`\n    لاگ‌های سیستمی Carbon‌شده را دریافت کنید.\n• `{i}logs heroku`\n   ۱۰۰ خط آخر لاگ‌های Heroku را دریافت کنید.\n\n• `{i}shutdown`\n    ربات خود را خاموش کنید.\n"
help_broadcast: "\n\n• `{i}addch <id/reply to list/none>`\n    چت را به دیتابیس اضافه کنید. اگر شناسه‌ای مشخص نشود، چت فعلی اضافه می‌شود.\n\n• `{i}remch <all/id/none>`\n    چت مشخص‌شده را حذف کنید (اگر چیزی مشخص نشود، چت فعلی) یا همه چت‌ها را حذف کنید.\n\n• `{i}broadcast <reply to msg>`\n    پیام ریپلای‌شده را به همه چت‌های موجود در دیتابیس ارسال کنید.\n\n• `{i}forward <reply to msg>`\n     پیام را به همه چت‌های موجود در دیتابیس فوروارد کنید.\n\n• `{i}listchannels`\n    فهرست همه چت‌های اضافه‌شده را دریافت کنید.\n"
help_button: " -\n\n• `{i}button <text with button format`\n   یک دکمه بسازید؛ می‌توانید به تصویر هم ریپلای کنید.\n\nفرمت:- `{i}button Hey There! @DarkPentesterBot 😎.\n[DarkPentesterBot | t.me/DarkPentesterBot][Support | t.me/DarkPentesterBot | same]\n[DarkPentesterBot | t.me/DarkPentesterBot]`\n"
help_calculator: " -\n\n•`{i}calc` - ماشین‌حساب اینلاین\n\n"
help_channelhacks: "\n\n🔹 `{i}shift <from channel> | <to channel>`\n     همه پست‌های قدیمی را از کانال A به کانال B منتقل می‌کند.\n      (می‌توانید از نام کاربری یا شناسه کانال نیز استفاده کنید)\n      مثال: `{i}shift @abc | @xyz`\n      [نکته - وجود علامت (' | ') ضروری است]\n\n🔹 برای ارسال خودکار/فوروارد همه پیام‌های جدید از هر کانال منبع به هر کانال مقصد.\n\n   `{i}asource <channel username or id>`\n      کانال منبع را به دیتابیس اضافه می‌کند.\n   `{i}dsource <channel username or id>`\n      کانال‌های منبع را از دیتابیس حذف می‌کند.\n   `{i}listsource <channel username or id>`\n      فهرست کانال‌های منبع را نمایش می‌دهد.\n\n\n   `{i}adest <channel username or id>`\n      کانال‌های شما را به دیتابیس اضافه می‌کند.\n   `{i}ddest <channel username or id>`\n      کانال‌های شما را از دیتابیس حذف می‌کند.\n   `{i}listdest <channel username or id>`\n      فهرست کانال‌های شما را نمایش می‌دهد.\n\n   'می‌توانید چندین کانال را در دیتابیس تنظیم کنید'\n   'برای فعال‌سازی ارسال خودکار از `{i}setdb AUTOPOST True` استفاده کنید'\n"
help_chatbot: " -\n\n• `{i}addai <reply to user/give username/userid>`\n   یک ربات چت هوش مصنوعی اضافه کنید تا به آن کاربر پاسخ دهد.\n\n• `{i}remai <reply to user/give username/userid>`\n   ربات چت هوش مصنوعی را حذف کنید.\n\n• `{i}repai <reply to user/give a message>`\n   با استفاده از AI به کاربر پاسخ دهید.\n\n• `{i}listai`\n   فهرست کاربران دارای AI را مشاهده کنید.\n"
help_chats: " -\n\n• `{i}delchat <optional- username/id>`\n    گروهی را که این دستور در آن اجرا شده حذف کنید.\n\n• `{i}getlink`\n• `{i}getlink r` - `ساخت لینک با تأیید ادمین`\n• `{i}getlink r title_here` - `تأیید ادمین با عنوان لینک`\n• `{i}getlink 10` - `محدودیت استفاده از لینک جدید`\n    لینک گروهی را که این دستور در آن اجرا شده دریافت کنید.\n\n• `{i}create (g|b|c) <group_name> ; <optional-username>`\n    گروهی با نام مشخص ایجاد کنید.\n    g - مگاگر‌وپ/سوپرگروه\n    b - گروه کوچک\n    c - کانال\n\n• `{i}setgpic <reply to Photo><chat username>`\n    عکس پروفایل گروه را تنظیم کنید.\n\n• `{i}delgpic <chat username -optional>`\n    عکس پروفایل گروه را حذف کنید.\n\n• `{i}unbanall`\n    همه اعضای گروه را آن‌بن کنید.\n\n• `{i}rmusers`\n    کاربران را به‌صورت مشخص حذف کنید.\n"
help_cleanaction: " -\n\n•`{i}addclean`\n    همه پیام‌های رویدادهای بعدی در چت اضافه‌شده مانند ورود/خروج/پین و غیره را پاک کنید.\n\n•`{i}remclean`\n    چت را از دیتابیس حذف کنید.\n\n•`{i}listclean`\n   فهرست همه چت‌هایی را که این قابلیت در آن‌ها فعال است دریافت کنید.\n\n"
help_converter: " -\n\n• `{i}convert <gif/img/sticker/webm>`\n    برای تبدیل مدیا به GIF / تصویر / WebM / استیکر معمولی، به آن ریپلای کنید.\n\n• `{i}doc <filename.ext>`\n    برای ذخیره پیام متنی در فایل، به آن ریپلای کنید.\n\n• `{i}open`\n    برای نمایش متن فایل، به آن ریپلای کنید.\n\n• `{i}rename <file name with extension>`\n    نام فایل را تغییر دهید.\n\n• `{i}thumbnail <reply to image/thumbnail file>`\n    فایل خود را با thumbnail سفارشی آپلود کنید.\n"
help_core: " -\n\n• `{i}install <reply to plugin>`\n    برای نصب پلاگین،\n  `{i}install f`\n    برای نصب اجباری.\n\n• `{i}uninstall <plugin name>`\n    پلاگین را Unload و حذف کنید.\n\n• `{i}load <plugin name>`\n    پلاگین غیررسمی Unload‌شده را Load کنید.\n\n• `{i}unload <plugin name>`\n    پلاگین غیررسمی را Unload کنید.\n\n• `{i}help <plugin name>`\n    برای هر پلاگین یک منوی راهنما مانند این نمایش می‌دهد.\n\n• `{i}getaddons <raw link to code>`\n    پلاگین‌ها را از لینک خام کد مشخص‌شده بارگذاری کنید.\n"
help_database: " -\n\n• **دستورات دیتابیس؛ اگر نمی‌دانید چیستند از آن‌ها استفاده نکنید.**\n\n• `{i}setdb key | value`\n    مقدار را در دیتابیس تنظیم کنید.\n    مثال:\n    `{i}setdb hi there`\n    `{i}setdb hi there | heartless here`\n    `{i}setdb --extend variable value` یا `{i}setdb -e variable value` برای افزودن مقدار به مقادیر موجود در دیتابیس.\n\n• `{i}deldb key`\n    کلید را از DB حذف کنید.\n\n• `{i}rendb old keyname | new keyname`\n    نام کلید را به‌روزرسانی کنید.\n"
help_devtools: " -\n\n• `{i}bash <cmds>`\n• `{i}bash -c <cmds>` خروجی دستور را به تصویر Carbon تبدیل می‌کند.\n    دستورات Linux را در تلگرام اجرا کنید.\n\n• `{i}eval <code>`\n    دستورات Python را در تلگرام اجرا کنید.\n    میانبرها:\n        client = bot = event.client\n        e = event\n        p = print\n        reply = await event.get_reply_message()\n        chat = event.chat_id\n\n• `{i}cpp <code>`\n    کد C++ را از تلگرام اجرا کنید.\n\n• `{i}sysinfo`\n    اطلاعات سیستم را نمایش می‌دهد.\n"
help_downloadupload: " -\n\n• `{i}ul <path/to/file>`\n    فایل‌ها را در تلگرام آپلود کنید.\n    آرگومان‌های زیر را در صورت نیاز قبل یا بعد از نام فایل استفاده کنید:\n      `--stream` برای آپلود به‌صورت stream.\n      `--delete` برای حذف فایل پس از آپلود.\n      `--no-thumb` برای آپلود بدون thumbnail.\n\n• `{i}dl <filename(optional)>`\n    برای دانلود فایل، به آن ریپلای کنید.\n\n• `{i}download <DDL> (| filename)`\n    با استفاده از DDL دانلود کنید. اگر نام فایل داده نشود، نام آن به‌صورت خودکار ساخته می‌شود.\n"
help_echo: "\n\n•`{i}addecho <reply to anyone>`\n   Echo خودکار پیام کاربر ریپلای‌شده را شروع کنید.\n\n•`{i}remecho <reply to anyone>`\n   آن را خاموش کنید.\n\n•`{i}listecho <reply to anyone>`\n   فهرست را دریافت کنید.\n"
help_extra: " -\n\n• `{i}del <reply to message>`\n    پیام ریپلای‌شده را حذف کنید.\n\n• `{i}edit <new message>`\n    آخرین پیام خود یا پیام ریپلای‌شده را ویرایش کنید.\n\n• `{i}copy <reply to message>`\n    پیام/مدیای ریپلای‌شده را کپی کنید.\n\n• `{i}reply`\n    آخرین پیام ارسال‌شده را به کاربر ریپلای‌شده پاسخ دهید.\n"
help_fakeaction: " -\n\n<b>Fake Actions</b>\n\n• `{i}ftyping [time]`\n• `{i}faudio [time]`\n• `{i}fvideo [time]`\n• `{i}fgame [time]`\n• `{i}fsticker [time]`\n• `{i}flocation [time]`\n• `{i}fcontact [time]`\n• `{i}fround [time]`\n• `{i}fphoto [time]`\n• `{i}fdocument [time]`\n    `عمل انتخاب‌شده تلگرام را برای مدت مشخص نمایش می‌دهد.`\n\n<b>زمان</b>\n    `<number>` = ثانیه\n    `<number>s` = ثانیه\n    `<number>m` = دقیقه\n    `<number>h` = ساعت\n    `<number>d` = روز\n\n    `مثال‌ها:`\n    `{i}ftyping 10`\n    `{i}ftyping 30s`\n    `{i}ftyping 5m`\n    `{i}ftyping 2h`\n    `{i}ftyping 1d`\n\n<b>هدف</b>\n    `Actionها را می‌توان به چت فعلی یا یک کاربر/چت مشخص ارسال کرد.`\n\n    `{i}ftyping @username 10`\n    `{i}ftyping 123456789 10`\n    `{i}ftyping 10 @username`\n    `{i}ftyping 10 123456789`\n\n    `نام کاربری و شناسه عددی تلگرام پشتیبانی می‌شوند.`\n\n<b>مدت پیش‌فرض</b>\n    `{i}ftyping`\n    `اگر مدت مشخص نشود، مدت پیش‌فرض استفاده می‌شود.`\n\n<b>توقف Action معمولی</b>\n    `{i}ftyping off`\n    `{i}ftyping off @username`\n    `{i}ftyping off 123456789`\n    `برای توقف Fake Action فعال از off استفاده کنید.`\n\n<b>حالت ALL</b>\n    `{i}all ftyping 10`\n    `Fake Typing را هر بار که پیام ورودی جدید دریافت می‌شود، به‌صورت خودکار اجرا می‌کند.`\n\n    `{i}all ftyping 10h`\n    `هر بار که پیام جدید آن را فعال کند، Fake Action را به مدت ۱۰ ساعت فعال نگه می‌دارد.`\n\n    `{i}all ftyping @username 10`\n    `{i}all ftyping 10 @username`\n    `فقط پیام‌های کاربر مشخص‌شده Action را فعال می‌کنند.`\n\n    `{i}all ftyping 123456789 10`\n    `می‌توان از شناسه عددی کاربر نیز به‌عنوان هدف محرک استفاده کرد.`\n\n<b>توقف حالت ALL</b>\n    `{i}all ftyping off`\n    `{i}all faudio off`\n    `{i}all fvideo off`\n    `همین فرمت با همه Fake Actionها کار می‌کند.`\n\n<b>FSeen</b>\n    `{i}fseen`\n    `در چت خصوصی، پیام‌های جدید آن کاربر را به‌صورت خودکار خوانده‌شده علامت بزنید.`\n\n    `{i}fseen @username`\n    `{i}fseen 123456789`\n    `یک کاربر مشخص را با نام کاربری یا شناسه عددی پایش کنید.`\n\n    `در گروه‌ها، به پیام کاربر ریپلای کنید و {i}fseen را اجرا کنید.`\n\n<b>حالت FSeen ALL</b>\n    `{i}all fseen`\n    `{i}all fseen @username`\n    `{i}all fseen 123456789`\n    `پیام‌های جدید کاربر انتخاب‌شده را به‌صورت خودکار خوانده‌شده علامت می‌زند.`\n\n    `حالت ALL فقط به پیام‌هایی که پس از فعال‌سازی دریافت می‌شوند واکنش نشان می‌دهد.`\n\n<b>توقف FSeen</b>\n    `{i}fseen off`\n    `{i}fseen off @username`\n    `{i}fseen off 123456789`\n    `تأیید خودکار خوانده‌شدن برای کاربر انتخاب‌شده را متوقف می‌کند.`\n\n<b>توقف حالت FSeen ALL</b>\n    `{i}all fseen off`\n    `{i}all fseen off @username`\n    `{i}all fseen off 123456789`\n    `Watcher انتخاب‌شده FSeen ALL را متوقف می‌کند.`\n\n<b>نکات</b>\n    `• حالت ALL فقط روی پیام‌های دریافت‌شده پس از فعال‌سازی اعمال می‌شود.`\n    `• پیام جدید در همان چت، وظیفه Fake Action قبلی را جایگزین می‌کند.`\n    `• Fake Actionهای تلگرام در سطح چت هستند و نمی‌توان آن‌ها را فقط برای یک عضو گروه نمایش داد.`\n    `• FSeen از سیستم تأیید خوانده‌شدن تلگرام استفاده می‌کند.`\n    `• شناسه‌های عددی ممکن است نیاز داشته باشند حساب قبلاً Entity هدف را دیده باشد یا به آن دسترسی داشته باشد.`\n    `• هر Fake Action می‌تواند حالت ALL مستقل خود را داشته باشد.`\n"
help_fedutils: " -\n\n• `{i}superfban <reply to user/userid/username>`\n    شخص را در تمام فدهایی که در آن‌ها ادمین هستید FBan کنید.\n\n• `{i}superunfban <reply to user/userid/username>`\n    شخص را در تمام فدهایی که در آن‌ها ادمین هستید Un-FBan کنید.\n\nگروه FBan و فدهایی را که باید مستثنی شوند در دستیار مشخص کنید.\n\n• `{i}fstat <username/id/reply to user>`\n    وضعیت fed شخص را در Rose دریافت کنید.\n\n• `{i}fedinfo <(fedid)>`\n    اطلاعات فدِ شناسه داده‌شده یا فدی که مالک آن هستید را از Rose دریافت کنید.\n"
help_fileshare: " -\n\n• `{i}fs <query>`\n    `فایل‌های ذخیره‌شده/اشتراکی خود را بر اساس نام جستجو کنید.`\n\n• `{i}fileshare <query>`\n    `همانند fs است. فایل‌ها را به‌صورت اینلاین جستجو و اشتراک‌گذاری کنید.`\n\n• `{i}fs`\n    `رابط اینلاین Fileshare را باز کنید و فایل‌های موجود را مرور کنید.`\n\n**حالت اینلاین:**\n    `تمام عملیات Fileshare برای کار در حالت اینلاین طراحی شده‌اند.`\n\n    `دستور را همراه با عبارت جستجو وارد کنید و یک نتیجه را از فهرست اینلاین انتخاب کنید.`\n\n    `مثال:`\n    `{i}fs song`\n    `{i}fs movie`\n    `{i}fs document`\n\n**جستجو:**\n    `{i}fs <name>`\n    `فایل‌ها را بر اساس نام فایل یا عنوان ذخیره‌شده جستجو کنید.`\n\n    `{i}fs pdf`\n    `{i}fs photo`\n    `{i}fs myfile`\n\n    `جستجو به حروف بزرگ و کوچک حساس نیست و از نام‌های جزئی پشتیبانی می‌کند.`\n\n**انواع فایل:**\n    `فایل‌ها را می‌توان بر اساس نوع مدیا جستجو و نمایش داد.`\n\n    `دسته‌بندی‌های پشتیبانی‌شده می‌توانند شامل این موارد باشند:`\n    `Documents، Photos، Videos، Audio، Voice، Archives و سایر فایل‌ها.`\n\n**صفحه‌بندی:**\n    `اگر تعداد فایل‌ها بیشتر از ظرفیت نمایش هم‌زمان باشد، از دکمه‌های پیمایش در رابط اینلاین برای بارگذاری صفحه بعد یا قبل استفاده کنید.`\n\n    `صفحه‌بندی از کند شدن جستجوی اینلاین در مجموعه‌های بزرگ فایل جلوگیری می‌کند.`\n\n**اطلاعات فایل:**\n    `هر نتیجه می‌تواند اطلاعات مفیدی درباره فایل نمایش دهد، از جمله:`\n    `نام فایل، نوع فایل، اندازه، مدت‌زمان در صورت وجود و سایر فراداده‌های موجود.`\n\n**اشتراک‌گذاری:**\n    `هر فایل را از نتایج اینلاین انتخاب کنید تا در چت فعلی ارسال/اشتراک‌گذاری شود.`\n\n    `در صورت امکان فایل‌ها با استفاده از مدیای ذخیره‌شده تلگرام اشتراک‌گذاری می‌شوند تا از آپلود مجدد غیرضروری جلوگیری شود.`\n\n**نمونه‌های جستجوی اینلاین:**\n    `{i}fs linux`\n    `{i}fs tutorial`\n    `{i}fs mp3`\n    `{i}fs .zip`\n    `{i}fs 1080p`\n\n**جستجوی دقیق:**\n    `برای پیدا کردن یک فایل مشخص، نام کامل فایل را وارد کنید.`\n\n    `{i}fs Ubuntu 24.04.iso`\n    `{i}fs My Document.pdf`\n\n**جستجوی جزئی:**\n    `می‌توانید فقط بخشی از نام فایل را نیز وارد کنید.`\n\n    `{i}fs Ubuntu`\n    `{i}fs Document`\n    `{i}fs tutorial`\n\n**فیلتر مدیا:**\n    `برای محدود کردن نتایج، نوع مدیا یا پسوند را بخشی از عبارت جستجو قرار دهید.`\n\n    `{i}fs mp4`\n    `{i}fs mp3`\n    `{i}fs pdf`\n    `{i}fs zip`\n    `{i}fs jpg`\n\n**مدیریت فایل:**\n    `فایل‌های ذخیره‌شده توسط Fileshare را می‌توان بدون جستجوی دستی در پیام‌های تلگرام مدیریت کرد.`\n\n    `رابط اینلاین، اقدامات مدیریتی موجود را برای فایل‌های پشتیبانی‌شده ارائه می‌کند.`\n\n**حذف:**\n    `در صورت پشتیبانی، از گزینه حذف موجود در کنترل‌های اینلاین فایل برای حذف فایل ذخیره‌شده استفاده کنید.`\n\n    `برای جلوگیری از حذف تصادفی، حذف نیاز به تأیید دارد.`\n\n**پاک‌سازی:**\n    `در صورت پشتیبانی پلاگین، از گزینه Cleanup برای حذف ورودی‌های قدیمی یا ناخواسته استفاده کنید.`\n\n    `با احتیاط از Cleanup استفاده کنید، زیرا ورودی‌های حذف‌شده ممکن است دیگر در نتایج جستجوی Fileshare نمایش داده نشوند.`\n\n**جزئیات فایل:**\n    `گزینه Details را از یک نتیجه اینلاین باز کنید تا قبل از اشتراک‌گذاری یا مدیریت فایل، اطلاعات ذخیره‌شده را بررسی کنید.`\n\n**استفاده سریع:**\n    `1. هر چت تلگرامی را باز کنید.`\n    `2. دستور اینلاین Fileshare را شروع کنید.`\n    `3. نام فایل یا بخشی از نام فایل را وارد کنید.`\n    `4. فایل موردنظر را از نتایج انتخاب کنید.`\n    `5. تلگرام فایل انتخاب‌شده را به چت فعلی ارسال می‌کند.`\n\n**کارایی:**\n    `Fileshare از اطلاعات ذخیره‌شده و قابل جستجو استفاده می‌کند تا مجموعه‌های بزرگ بدون بارگذاری همه فایل‌ها در حافظه برای هر درخواست جستجو شوند.`\n\n    `برای سریع نگه داشتن پاسخ‌های اینلاین از صفحه‌بندی و محدودیت کنترل‌شده نتایج استفاده می‌شود.`\n\n**نکات:**\n    `نتایج جستجو به فایل‌های در دسترس Fileshare و فراداده ذخیره‌شده برای هر فایل بستگی دارد.`\n    `فایلی که از فضای ذخیره‌سازی زیرین تلگرام حذف شده باشد ممکن است دیگر قابل اشتراک‌گذاری نباشد.`\n    `فایل‌های بسیار بزرگ ممکن است مشمول محدودیت‌های خود تلگرام یا حساب کاربری باشند.`\n    `نتایج اینلاین به‌صورت پویا تولید می‌شوند و ممکن است طبق تنظیمات پلاگین Cache شوند.`\n    `اگر نتیجه‌ای نامعتبر شد، جستجوی اینلاین را Refresh کنید و دوباره امتحان کنید.`\n"
help_filter: " -\n\n• `{i}addfilter <word><reply to a message>`\n    کلمه موردنظر را به‌عنوان فیلتر مرتبط با پیام ریپلای‌شده اضافه کنید.\n\n• `{i}remfilter <word>`\n    کلمه فیلترشده را حذف کنید..\n\n• `{i}listfilter`\n    فهرست همه فیلترها را دریافت کنید.\n"
help_fontgen: "\n• `{i}font <font name> : <text>`\n    برای متن، فونت‌های مختلف تولید کنید.\n\n• `{i}font`\n    فهرست فونت‌ها را دریافت کنید.\n"
help_giftools: "\n\n•`{i}invertgif`\n  GIF را معکوس/نگاتیو کنید.\n\n•`{i}bwgif`\n  GIF را سیاه‌وسفید کنید.\n\n•`{i}rvgif`\n  GIF را برعکس کنید.\n\n•`{i}vtog`\n  به ویدیو ریپلای کنید تا GIF ساخته شود.\n  تبدیل Video به GIF.\n\n•`{i}gif <query>`\n   ویدیوی مرتبط با عبارت جستجو را ارسال کنید.\n"
help_globaltools: " -\n\n• `{i}gban <reply user/ username>`\n• `{i}ungban`\n    بن/آن‌بن سراسری.\n\n• `{i}gstat <reply to user/userid/username>`\n   بررسی کنید کاربر GBan شده است یا نه.\n\n• `{i}listgban` : فهرست همه کاربران GBan‌شده.\n\n• `{i}gmute` | `{i}ungmute` <reply user/ username>\n    میوت/آن‌میوت سراسری.\n\n• `{i}gkick <reply/username>` `کاربر را به‌صورت سراسری کیک می‌کند`\n• `{i}gcast <text/reply>` `پیام را به‌صورت سراسری در همه گروه‌ها ارسال می‌کند`\n\n• `{i}gadmincast <text/reply>` `پیام را در همه چت‌های ادمینی شما پخش می‌کند`\n• `{i}gucast <text/reply>` `پیام را در همه کاربران پیام خصوصی ارسال می‌کند`\n\n• `{i}gblacklist <chat id/username/nothing (for current chat)`\n   چت را به لیست سیاه اضافه می‌کند و Broadcast سراسری را نادیده می‌گیرد.\n• `{i}ungblacklist` `چت را از لیست سیاه حذف می‌کند.`\n\n• `{i}gpromote <reply to user> <channel/group/all> <rank>`\n    کاربر را در جاهایی که ادمین هستید به‌صورت سراسری ارتقا دهید.\n    - مشخص کنید ارتقا فقط در گروه‌ها/کانال‌ها/همه‌جا انجام شود.\n    مثال: `gpromote group boss` ~ کاربر را در همه گروه‌ها ارتقا می‌دهد.\n        `gpromote @username all sar` ~ کاربر را در همه گروه‌ها و کانال‌ها ارتقا می‌دهد.\n• `{i}gdemote` - `کاربر را به‌صورت سراسری تنزل دهید`\n"
help_greetings: " -\n\n---- خوش‌آمدگویی‌ها ----\n• `{i}setwelcome <message/reply to message>`\n    پیام خوش‌آمدگویی را در چت فعلی تنظیم کنید.\n\n• `{i}clearwelcome`\n    پیام خوش‌آمدگویی چت فعلی را حذف کنید.\n\n• `{i}getwelcome`\n    پیام خوش‌آمدگویی چت فعلی را دریافت کنید.\n\n---- خداحافظی‌ها ----\n• `{i}setgoodbye <message/reply to message>`\n    پیام خداحافظی را در چت فعلی تنظیم کنید.\n\n• `{i}cleargoodbye`\n    پیام خداحافظی چت فعلی را حذف کنید.\n\n• `{i}getgoodbye`\n    پیام خداحافظی چت فعلی را دریافت کنید.\n\n• `{i}thankmembers on/off`\n    وقتی تعداد اعضای گروه به 100*x برسد، یک استیکر تشکر ارسال کنید.\n"
help_imagetools: " -\n\n• `{i}border <reply to photo/sticker>`\n    دور آن مدیا حاشیه ایجاد کنید..\n    مثال - `{i}border 12,22,23`\n       - `{i}border 12,22,23 ; width (in number)`\n\n• `{i}grey <reply to any media>`\n    آن را سیاه‌وسفید کنید.\n\n• `{i}color <reply to any Black nd White media>`\n    آن را رنگی کنید.\n\n• `{i}toon <reply to any media>`\n    آن را کارتونی کنید.\n\n• `{i}danger <reply to any media>`\n    ظاهر خطرناک به آن بدهید.\n\n• `{i}negative <reply to any media>`\n    تصویر را نگاتیو کنید.\n\n• `{i}blur <reply to any media>`\n    تصویر را تار کنید.\n\n• `{i}quad <reply to any media>`\n    یک Vortex ایجاد کنید.\n\n• `{i}mirror <reply to any media>`\n    تصویر آینه‌ای ایجاد کنید.\n\n• `{i}flip <reply to any media>`\n    تصویر را برگردانید.\n\n• `{i}sketch <reply to any media>`\n    طرح Sketch آن را ایجاد کنید.\n\n• `{i}blue <reply to any media>`\n    فقط برای جذاب‌تر شدن.\n\n• `{i}csample <color name /color code>`\n   مثال: `{i}csample red`\n             `{i}csample #ffffff`\n\n• `{i}pixelator <reply image>`\n    یک تصویر Pixelated ایجاد کنید..\n"
help_instagram: " -\n\n• `{i}ig <Instagram Url>`\n  `پست‌ها، ریلز، TV یا استوری‌های اینستاگرام را دانلود کنید`\n\n• اختیاری: `IG_COOKIES` را تنظیم کنید (مسیر فایل کوکی) برای مدیای خصوصی/محدودشده\n"
help_locks: " -\n\n• `{i}lock <msgs/media/sticker/gif/games/inline/polls/invites/pin/changeinfo>`\n    تنظیمات موردنظر را در گروه قفل کنید.\n\n• `{i}unlock <msgs/media/sticker/gif/games/inline/polls/invites/pin/changeinfo>`\n    تنظیمات موردنظر را در گروه باز کنید.\n"
help_logo: " -\n\n• `{i}logo <text>`\n   برای متن داده‌شده لوگو تولید کنید.\n   یا به تصویر ریپلای کنید تا متن شما روی آن نوشته شود.\n   یا به فایل فونت ریپلای کنید تا متن با آن فونت نوشته شود.\n\n"
help_mediatools: " -\n\n• `{i}mediainfo <reply to media>`\n   اطلاعات آن را دریافت کنید.\n\n• `{i}rotate <degree/angle> <reply to media>`\n   هر ویدیو/عکس/مدیا را بچرخانید..\n   نکته: برای ویدیو باید زاویه مضربی از ۹۰ باشد.\n"
help_misc: " -\n\n• `{i}eod`\n    `رویدادهای امروز را دریافت کنید`\n\n• `{i}pntrst <link/id>`\n    پین‌های Pinterest را دانلود و ارسال کنید.\n\n• `{i}gadget <search query>`\n    جستجوی Gadget از تلگرام.\n\n• `{i}randomuser`\n   اطلاعات یک کاربر تصادفی را تولید کنید.\n\n• `{i}ascii <reply image>`\n    تصویر ریپلای‌شده را به HTML تبدیل کنید.\n"
help_mute: " -\n\n• `{i}mute <reply to msg/ user id>`\n    کاربر را در چت فعلی میوت کنید.\n\n• `{i}unmute <reply to msg/ user id>`\n    کاربر را در چت فعلی آن‌میوت کنید.\n\n• `{i}dmute <reply to msg/ user id>`\n    کاربر را با حذف پیام‌هایش در چت فعلی میوت کنید.\n\n• `{i}undmute <reply to msg/ use id>`\n    کاربر dmute‌شده را در چت فعلی آن‌میوت کنید.\n\n• `{i}tmute <time> <reply to msg/ use id>`\n    s- ثانیه\n    m- دقیقه\n    h- ساعت\n    d- روز\n    کاربر را برای مدت مشخص در چت فعلی میوت کنید.\n"
help_notes: " -\n\n• `{i}addnote <word><reply to a message>`\n    کلمه موردنظر را به‌عنوان Note مرتبط با پیام ریپلای‌شده در چت ذخیره کنید.\n\n• `{i}remnote <word>`\n    Note را از چت حذف کنید.\n\n• `{i}listnote`\n    فهرست همه Noteها را دریافت کنید.\n\n• استفاده:\n   Noteها را در گروه تنظیم کنید تا همه بتوانند از آن‌ها استفاده کنند.\n   برای دریافت آن، `#(Keyword of note)` را ارسال کنید.\n"
help_other: " -\n\n• `{i}send <username/id> <reply/type>`\n    پیام را به کاربر/چت ارسال کنید.\n\n• `{i}fwdreply <reply to msg>`\n    با فوروارد کردن پیام، به پیام شخص در خصوصی پاسخ دهید.\n\n• `{i}save <reply message>`\n    پیام ریپلای‌شده را در Saved Messages ذخیره کنید.\n\n• `{i}fsave <reply message>`\n    پیام ریپلای‌شده را به Saved Messages فوروارد کنید.\n"
help_pmpermit: " -\n\n• `{i}a` یا `{i}approve`\n    اجازه ارسال پیام خصوصی به شخص بدهید.\n\n• `{i}da` یا `{i}disapprove`\n    اجازه پیام خصوصی شخص را لغو کنید.\n\n• `{i}block`\n    شخصی را بلاک کنید.\n\n• `{i}unblock` | `{i}unblock all`\n    شخص یا همه را آن‌بلوک کنید.\n\n• `{i}nologpm`\n    ثبت پیام‌های کاربر را متوقف کنید.\n\n• `{i}logpm`\n    ثبت پیام‌های کاربر را شروع کنید.\n\n• `{i}startarchive`\n    پیام‌های خصوصی جدید را آرشیو کنید.\n\n• `{i}stoparchive`\n    آرشیو پیام‌های خصوصی جدید را متوقف کنید.\n\n• `{i}cleararchive`\n    همه چت‌ها را از آرشیو خارج کنید.\n\n• `{i}listapproved`\n   فهرست همه پیام‌های خصوصی تأییدشده.\n"
help_polls: " -\n\n• `{i}poll <question> ; <option> ; <option>`\n    نظرسنجی ناشناس با گزینه‌های داده‌شده ایجاد کنید.\n\n• `{i}poll <question> ; <option> ; <option> | <type>`\n    نظرسنجی را با نوع دلخواه ایجاد کنید!\n    type باید یکی از `public`، `multiple` یا `quiz` باشد.\n\n• `{i}poll <question> ; <option> ; <option> | quiz_<answerno>`\n    نظرسنجی Quiz ایجاد کنید؛ answerno شماره گزینه صحیح است.\n\n"
help_profile: " -\n\n• `{i}setname <first name // last name>`\n    نام پروفایل خود را تغییر دهید.\n\n• `{i}setbio <bio>`\n    Bio پروفایل خود را تغییر دهید.\n\n• `{i}setpic <reply to pic>`\n    عکس پروفایل خود را تغییر دهید.\n\n• `{i}delpfp <n>(optional)`\n    یک عکس پروفایل را حذف کنید؛ اگر مقداری داده نشود، n عکس حذف می‌شود.\n\n• `{i}poto <username>`\n    در صورت موجود بودن، عکس چت/کاربر را آپلود کنید.\n"
help_qrcode: " -\n\n• `{i}qrcode <text/reply to text>`\n   `از متن QR Code می‌سازد`\n\n• `{i}addqr <reply image> <text>`\n   `از متن QR ساخته و آن را به تصویر اضافه می‌کند.`\n\n• `{i}qrdecode <reply to qrcode>`\n   `QR Code را Decode می‌کند.`\n"
help_resize: " -\n\n•`{i}size <reply to media>`\n   اندازه آن را دریافت کنید.\n\n•`{i}resize <number> <number>`\n   تصویر را روی محورهای x و y تغییر اندازه دهید.\n   مثال: `{i}resize 690 960`\n"
help_schedulemsg: " -\n\n•`{i}schedule <text/reply to msg> <time>`\n    برای زمان می‌توانید عدد ثانیه یا عباراتی مانند 1h یا 1m استفاده کنید.\n    مثال: `{i}schedule Hello 100` پیام را پس از ۱۰۰ ثانیه ارسال می‌کند.\n    مثال: `{i}schedule Hello 1h` پیام را پس از یک ساعت ارسال می‌کند.\n"
help_search: " -\n\n• `{i}saavn <search query>`\n    آهنگ‌ها را از Saavn دانلود کنید.\n\n• `{i}google <query>`\n    جستجوی Google انجام دهید.\n\n• `{i}github <username>`\n    اطلاعات کامل پروفایل GitHub کاربر را دریافت کنید.\n\n• `{i}img <query>`\n  `{i}img <query> ; <no of results>`\n    جستجوی تصویر انجام دهید.\n\n• `{i}reverse`\n    به تصویر یا استیکر ریپلای کنید تا منبع آن را پیدا کنید.\n"
help_snips: " -\n\n• `{i}addsnip <word><reply to a message>`\n    کلمه را به‌عنوان Snip مرتبط با پیام ریپلای‌شده ذخیره کنید.\n\n• `{i}remsnip <word>`\n    کلمه Snip را حذف کنید..\n\n• `{i}listsnip`\n    فهرست همه Snipها را دریافت کنید.\n\n• استفاده:\n    `$(ur snip word)` را ارسال کنید تا پاسخ ذخیره‌شده دریافت شود.\n"
help_specialtools: " -\n\n• `{i}wspr <username>`\n    پیام محرمانه ارسال کنید..\n\n• `{i}q <color-optional>`\n• `{i}q @username`\n• `{i}q r <color-optional>`\n• `{i}q count` : `نقل‌قول‌های متعدد`\n    Quote ایجاد کنید..\n\n• `{i}sticker <query>`\n    استیکرها را مطابق خواسته خود جستجو کنید..\n\n• `{i}getaudio <reply to an audio>`\n    صوت را دانلود کنید تا در ویدیو/GIF دلخواه خود قرار دهید.\n\n• `{i}addaudio <reply to Video/gif>`\n    صوت بالا را به ویدیوی/GIF ریپلای‌شده اضافه می‌کند.\n\n• `{i}dob <date of birth>`\n    فقط با فرمت dd/mm/yy وارد کنید (مثال: .dob 01/01/1999).\n\n• `{i}wall <query>`\n    والپیپر HD را مطابق خواسته خود جستجو کنید..\n"
help_stickertools: " -\n\n• `{i}destroy <reply to animated sticker>`\n    استیکر را Destroy کنید.\n\n• `{i}tiny <reply to media>`\n    استیکرهای Tiny ایجاد کنید.\n\n• `{i}kang <reply to image/sticker>`\n    استیکر را Kang کنید (به Pack خود اضافه کنید).\n\n• `{i}packkang <pack name>`\n    کل مجموعه استیکر را با نام سفارشی Kang کنید.\n\n• `{i}round <reply to any media>`\n    استیکر گرد را استخراج کنید.\n"
help_sudo: " -\n\n• `{i}addsudo`\n    با ریپلای به کاربر یا استفاده از useridهای جداشده با <space>، Sudo User اضافه کنید.\n\n• `{i}delsudo`\n    با ریپلای به کاربر یا استفاده از useridهای جداشده با <space>، Sudo User حذف کنید.\n\n• `{i}listsudo`\n    فهرست همه Sudo Userها را دریافت کنید.\n"
help_tag: " -\n\n• `{i}tagall`\n    ۱۰۰ عضو اول چت را تگ کنید.\n\n• `{i}tagadmins`\n    ادمین‌های چت را تگ کنید.\n\n• `{i}tagowner`\n    مالک چت را تگ کنید.\n\n• `{i}tagbots`\n    ربات‌های چت را تگ کنید.\n\n• `{i}tagrec`\n    اعضای اخیراً فعال را تگ کنید.\n\n• `{i}tagon`\n    اعضای آنلاین را تگ کنید (فقط در صورت خاموش بودن Privacy کار می‌کند).\n\n• `{i}tagoff`\n    اعضای آفلاین را تگ کنید (فقط در صورت خاموش بودن Privacy کار می‌کند).\n"
help_tools: " -\n\n• `{i}circle`\n    به یک آهنگ صوتی یا GIF ریپلای کنید تا Video Note دریافت کنید.\n\n• `{i}ls`\n    همه فایل‌های داخل یک Directory را دریافت کنید.\n\n• `{i}bots`\n    تعداد ربات‌های چت فعلی را همراه با لینک دائمی آن‌ها نمایش می‌دهد.\n\n• `{i}hl <a link> <text-optional>`\n    لینک را با یک فاصله به‌صورت پیام Embed می‌کند.\n\n• `{i}id`\n    برای دریافت ID استیکر به آن ریپلای کنید.\n    برای دریافت ID کاربر به او ریپلای کنید.\n    بدون ریپلای، ID چت را دریافت می‌کنید.\n\n• `{i}sg <reply to a user><username/id>`\n    تاریخچه نام کاربری شخص ریپلای‌شده را دریافت کنید.\n\n• `{i}tr <dest lang code> <(reply to) a message>`\n    پیام را ترجمه کنید.\n\n• `{i}webshot <url>`\n    از صفحه وب Screenshot بگیرید.\n\n• `{i}shorturl <url> <id-optional>`\n    هر URL را کوتاه کنید...\n"
help_unsplash: " -\n\n• {i}unsplash <search query> ; <no of pics>\n    جستجوی تصویر در Unsplash.\n"
help_usage: "\n\n• `{i}usage`\n    میزان مصرف کلی را دریافت کنید.\n\n• `{i}usage heroku`\n   آمار Heroku را دریافت کنید.\n\n• `{i}usage db`\n   میزان مصرف فضای دیتابیس را دریافت کنید.\n"
help_utilities: " -\n\n• `{i}kickme` : گروه را ترک می‌کند.\n\n• `{i}date` : تقویم را نمایش می‌دهد.\n\n• `{i}listreserved`\n    همه نام‌های کاربری (کانال‌ها/گروه‌ها) تحت مالکیت شما را فهرست می‌کند.\n\n• `{i}stats` : آمار پروفایل شما را نمایش می‌دهد.\n\n• `{i}paste` - `متن طولانی را وارد کنید / به فایل متنی ریپلای کنید.`\n\n• `{i}info <username/userid/chatid>`\n    به پیام شخصی ریپلای کنید.\n\n• `{i}invite <username/userid>`\n    کاربر را به چت اضافه کنید.\n\n• `{i}rmbg <reply to pic>`\n    پس‌زمینه تصویر را حذف کنید.\n\n• `{i}telegraph <reply to media/text>`\n    مدیا/متن را در Telegraph آپلود کنید.\n\n• `{i}json <reply to msg>`\n    encoding JSON پیام را دریافت کنید.\n\n• `{i}suggest <reply to message> or <poll title>`\n    برای پیشنهاد ریپلای‌شده یک نظرسنجی بله/خیر ایجاد کنید.\n\n• `{i}ipinfo <ipAddress>` : اطلاعات آن IP Address را دریافت کنید.\n\n• `{i}cpy <reply to message>`\n   پیام ریپلای‌شده را با قالب‌بندی کپی کنید. پس از ۲۴ ساعت منقضی می‌شود.\n• `{i}pst`\n   پیام کپی‌شده را با قالب‌بندی Paste کنید.\n\n• `{i}thumb <reply file>` : thumbnail فایل ریپلای‌شده را دانلود کنید.\n\n• `{i}getmsg <message link>`\n  پیام‌ها را از چت‌هایی با محدودیت Forward/Copy دریافت کنید.\n"
help_variables: " -\n\n• `{i}get var <variable name>`\n   مقدار نام متغیر داده‌شده را دریافت کنید.\n\n• `{i}get type <variable name>`\n   نوع متغیر را دریافت کنید.\n\n• `{i}get db <key>`\n   مقدار DB کلید داده‌شده را دریافت کنید.\n\n• `{i}get keys`\n   همه کلیدهای Redis را دریافت کنید.\n"
help_vctools: " -\n\n• `{i}startvc`\n    Group Call را در یک گروه شروع کنید.\n\n• `{i}stopvc`\n    Group Call را در یک گروه متوقف کنید.\n\n• `{i}vctitle <title>`\n    عنوان Group Call را تغییر دهید.\n\n• `{i}vcinvite`\n    همه اعضای گروه را به Group Call دعوت کنید.\n    (باید عضو گروه باشید)\n"
help_videotools: " -\n\n•`{i}sample <duration in seconds>`\n   نمونه کوتاهی از ویدیو ایجاد می‌کند..\n\n• `{i}vshots <number of shots>`\n   از ویدیو Screenshot ایجاد می‌کند..\n\n• `{i}vtrim <start time> - <end time> in seconds`\n    ویدیوی طولانی را برش می‌دهد..\n"
help_warn: "\n\n•`{i}warn <reply to user> <reason>`\n    اخطار می‌دهد.\n\n•`{i}resetwarn <reply to user>`\n    همه اخطارها را Reset می‌کند.\n\n•`{i}warns <reply to user>`\n   فهرست اخطارهای کاربر را دریافت می‌کند.\n\n•`{i}setwarn <warn count> | <ban/mute/kick>`\n   تعداد اخطار لازم را تنظیم کنید.\n   پس از علامت ' | ' عملی مانند ban/mute/kick را وارد کنید.\n   مقدار پیش‌فرض 3 kick است.\n   مثال: `setwarn 5 | mute`\n\n"
help_webupload: " -\n\n• `{i}webupload`\n    فایل‌ها را روی سرور دیگری آپلود کنید.\n"
help_words: " -\n\n• `{i}meaning <word>`\n    معنی کلمه را دریافت کنید.\n\n• `{i}synonym <word>`\n    همه مترادف‌ها را دریافت کنید.\n\n• `{i}antonym <word>`\n    همه متضادها را دریافت کنید.\n\n• `{i}ud <word>`\n    تعریف کلمه را از Urban Dictionary دریافت کنید.\n"
help_ziptools: "\n\n• `{i}zip <reply to file>`\n    فایل ریپلای‌شده را zip کنید.\n    برای تنظیم رمز روی zip: `{i}zip <password>` را در پاسخ به فایل اجرا کنید.\n\n• `{i}unzip <reply to zip file>`\n    فایل ریپلای‌شده را unzip کنید.\n\n• `{i}azip <reply to file>`\n   فایل را برای batch upload zip به صف اضافه کنید.\n\n• `{i}dozip`\n   فایل‌هایی را که با `{i}azip` اضافه کرده‌اید به‌صورت batch zip و آپلود کنید.\n   برای تنظیم رمز: `{i}dozip <password>`\n\n"
